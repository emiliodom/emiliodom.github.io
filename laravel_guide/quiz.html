<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laravel Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/laravel_styles.css">
    <script src="../assets/js/laravel_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>Laravel Final Assessment</h1>
        <p>Test your knowledge from Beginner to Senior Laravel Developer.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Beginner (20) ---
            { q: "What is Laravel?", options: ["A PHP framework", "A JavaScript library", "A database", "A CSS framework"], answer: 0 },
            { q: "Which command creates a new Laravel project?", options: ["laravel new app", "php artisan create", "composer create-project", "Both A and C"], answer: 3 },
            { q: "What is Artisan?", options: ["The command-line interface for Laravel", "A database tool", "A templating engine", "A testing framework"], answer: 0 },
            { q: "Where are routes defined in Laravel?", options: ["routes/web.php", "app/routes.php", "config/routes.php", "public/index.php"], answer: 0 },
            { q: "What is Blade?", options: ["Laravel's templating engine", "A database ORM", "A routing system", "A security feature"], answer: 0 },
            { q: "How do you display a variable in Blade?", options: ["{{ $var }}", "<?= $var ?>", "{!! $var !!}", "All of the above"], answer: 3 },
            { q: "What is Eloquent?", options: ["Laravel's ORM", "A validation library", "A migration tool", "A caching system"], answer: 0 },
            { q: "How do you retrieve all records from a model?", options: ["Model::all()", "Model::get()", "Model::fetch()", "Model::select()"], answer: 0 },
            { q: "What is a Migration?", options: ["Version control for the database", "Moving files", "Upgrading Laravel", "Deploying code"], answer: 0 },
            { q: "Which command runs migrations?", options: ["php artisan migrate", "php artisan db:seed", "php artisan make:migration", "php artisan schema:update"], answer: 0 },
            { q: "What is Middleware?", options: ["Code that runs before/after a request", "A database driver", "A frontend framework", "A testing tool"], answer: 0 },
            { q: "How do you create a controller?", options: ["php artisan make:controller", "php artisan create:controller", "php artisan new:controller", "php artisan controller:make"], answer: 0 },
            { q: "What is the purpose of the .env file?", options: ["Environment configuration", "Database storage", "Public assets", "Routing logic"], answer: 0 },
            { q: "How do you access configuration values?", options: ["config('app.name')", "Config::get('app.name')", "env('APP_NAME')", "All of the above"], answer: 3 },
            { q: "What is a Seeder?", options: ["A class to populate the database with test data", "A migration tool", "A validation rule", "A routing method"], answer: 0 },
            { q: "How do you validate a request?", options: ["$request->validate()", "Validator::make()", "FormRequest", "All of the above"], answer: 3 },
            { q: "What is Mass Assignment?", options: ["Assigning multiple attributes to a model at once", "Assigning roles", "Bulk email", "Database replication"], answer: 0 },
            { q: "Which property protects against Mass Assignment?", options: ["$fillable or $guarded", "$hidden", "$casts", "$dates"], answer: 0 },
            { q: "What is a Relationship in Eloquent?", options: ["Defining how tables are connected", "Friendship between users", "Server connection", "Route linking"], answer: 0 },
            { q: "How do you define a One-to-Many relationship?", options: ["hasMany() / belongsTo()", "hasOne() / belongsTo()", "belongsToMany()", "morphMany()"], answer: 0 },

            // --- Intermediate (20) ---
            { q: "What is a Service Provider?", options: ["The central place to configure the application", "A third-party API", "A hosting provider", "A database service"], answer: 0 },
            { q: "What is the Service Container?", options: ["A dependency injection container", "A Docker container", "A service wrapper", "A storage folder"], answer: 0 },
            { q: "How do you register a binding in the container?", options: ["$this->app->bind()", "$this->app->register()", "$this->app->singleton()", "Both A and C"], answer: 3 },
            { q: "What is a Facade?", options: ["A static interface to classes in the service container", "A design pattern", "A frontend component", "A database table"], answer: 0 },
            { q: "What is Route Model Binding?", options: ["Automatically injecting model instances into routes", "Binding routes to views", "Binding routes to controllers", "Binding models to database"], answer: 0 },
            { q: "What is a Job in Laravel?", options: ["A task that can be queued", "A cron job", "A controller method", "A database query"], answer: 0 },
            { q: "How do you dispatch a job?", options: ["Job::dispatch()", "dispatch(new Job)", "Both A and B", "Job::run()"], answer: 2 },
            { q: "What is a Queue?", options: ["A list of jobs to be processed asynchronously", "A waiting line", "A database table", "A cache store"], answer: 0 },
            { q: "What is an Event?", options: ["Something that happened in the application", "A calendar item", "A scheduled task", "A log entry"], answer: 0 },
            { q: "What is a Listener?", options: ["A class that handles an event", "A server process", "A database trigger", "A user action"], answer: 0 },
            { q: "What is a Policy?", options: ["A class to organize authorization logic", "A privacy policy", "A configuration file", "A middleware"], answer: 0 },
            { q: "What is a Gate?", options: ["A closure based way to authorize actions", "A database gate", "A route", "A view"], answer: 0 },
            { q: "How do you register a policy?", options: ["In AuthServiceProvider", "In RouteServiceProvider", "In AppServiceProvider", "In Kernel.php"], answer: 0 },
            { q: "What is the purpose of the 'can' middleware?", options: ["To authorize a user for a given action", "To check if a user can login", "To check if a user is banned", "To check if a site is online"], answer: 0 },
            { q: "What is a Resource Controller?", options: ["A controller that handles all CRUD operations", "A controller for assets", "A controller for API", "A controller for views"], answer: 0 },
            { q: "How do you create a resource controller?", options: ["php artisan make:controller PhotoController --resource", "php artisan make:resource PhotoController", "php artisan create:controller PhotoController", "php artisan controller:resource PhotoController"], answer: 0 },
            { q: "What is API Resource?", options: ["A transformation layer for JSON responses", "A database resource", "A file resource", "A route"], answer: 0 },
            { q: "What is the purpose of 'php artisan optimize'?", options: ["To cache configuration and routes", "To delete files", "To update composer", "To run tests"], answer: 0 },
            { q: "What is the 'storage' folder used for?", options: ["Logs, compiled templates, file uploads", "Database files", "Configuration", "Public assets"], answer: 0 },

            // --- Advanced (20) ---
            { q: "What is a Service Container Binding?", options: ["Registering a class or interface with the container", "Binding a book", "Linking tables", "Connecting to API"], answer: 0 },
            { q: "What is the difference between singleton and bind?", options: ["Singleton creates one instance shared across requests (or within request), bind creates a new instance every time", "Singleton is faster", "Bind is deprecated", "No difference"], answer: 0 },
            { q: "What is a Contract in Laravel?", options: ["A set of interfaces defining core services", "A legal document", "A database schema", "A route group"], answer: 0 },
            { q: "What is a Trait?", options: ["A mechanism for code reuse in single inheritance languages", "A characteristic", "A database field", "A testing tool"], answer: 0 },
            { q: "Which trait is used for Soft Deletes?", options: ["SoftDeletes", "Deletable", "Trashable", "Removable"], answer: 0 },
            { q: "What does 'Soft Delete' mean?", options: ["Marking a record as deleted without removing it from the database", "Deleting slowly", "Deleting files", "Deleting cache"], answer: 0 },
            { q: "What is a Scope in Eloquent?", options: ["A way to reuse query logic", "A telescope", "A variable scope", "A permission"], answer: 0 },
            { q: "How do you define a local scope?", options: ["Prefix method name with 'scope'", "Prefix with 'local'", "Use @scope annotation", "Define in config"], answer: 0 },
            { q: "What is an Accessor?", options: ["A method to format an attribute when retrieving it", "A method to access database", "A user role", "A permission"], answer: 0 },
            { q: "How do you define an Accessor?", options: ["get{Attribute}Attribute", "set{Attribute}Attribute", "access{Attribute}", "make{Attribute}"], answer: 0 },
            { q: "What is a Mutator?", options: ["A method to format an attribute before saving it", "A zombie", "A database trigger", "A validation rule"], answer: 0 },
            { q: "How do you define a Mutator?", options: ["set{Attribute}Attribute", "get{Attribute}Attribute", "mutate{Attribute}", "change{Attribute}"], answer: 0 },
            { q: "What is Polymorphic Relationship?", options: ["A model can belong to more than one other model on a single association", "Many to many", "One to one", "Self referencing"], answer: 0 },
            { q: "What is the 'morphTo' method used for?", options: ["Defining the inverse of a polymorphic relationship", "Transforming data", "Animating UI", "Routing"], answer: 0 },
            { q: "What is Laravel Horizon?", options: ["A dashboard and configuration system for Redis queues", "A frontend framework", "A database tool", "A testing tool"], answer: 0 },
            { q: "What is Laravel Telescope?", options: ["A debug assistant", "A star gazing tool", "A deployment tool", "A testing tool"], answer: 0 },
            { q: "What is Laravel Sanctum?", options: ["A lightweight authentication system for SPAs and simple APIs", "A heavy security suite", "A database", "A cloud provider"], answer: 0 },
            { q: "What is Laravel Passport?", options: ["Full OAuth2 server implementation", "A travel document", "A simple auth", "A middleware"], answer: 0 },
            { q: "What is Laravel Echo?", options: ["A JavaScript library for subscribing to channels and listening for events", "A sound effect", "A database replication", "A caching tool"], answer: 0 },
            { q: "What is Broadcasting?", options: ["Sharing server-side events with the client-side", "Radio transmission", "Sending emails", "Database seeding"], answer: 0 },

            // --- Expert (20) ---
            { q: "What is Dependency Injection?", options: ["A design pattern where dependencies are provided to a class", "Injecting code", "A virus", "A database query"], answer: 0 },
            { q: "What is Inversion of Control (IoC)?", options: ["A principle where the control of objects or portions of a program is transferred to a container or framework", "Losing control", "A database error", "A routing method"], answer: 0 },
            { q: "What is a Repository Pattern?", options: ["A layer between the domain and data mapping layers", "A git repository", "A storage folder", "A backup system"], answer: 0 },
            { q: "Why use Repository Pattern?", options: ["Decoupling business logic from data access logic", "It is faster", "It is required", "It looks cool"], answer: 0 },
            { q: "What is a Job Batch?", options: ["Executing a batch of jobs together", "A single job", "A cron job", "A failed job"], answer: 0 },
            { q: "What is Rate Limiting?", options: ["Restricting the number of requests a user can make", "Limiting speed", "Limiting database size", "Limiting file size"], answer: 0 },
            { q: "How do you define a rate limiter?", options: ["RateLimiter::for()", "Route::limit()", "Middleware::rate()", "Config::limit()"], answer: 0 },
            { q: "What is Task Scheduling?", options: ["Defining command schedule in code (Kernel.php)", "Using Outlook", "Writing on paper", "Using a database"], answer: 0 },
            { q: "What is the command to start the scheduler?", options: ["php artisan schedule:run", "php artisan schedule:start", "php artisan cron:run", "php artisan task:run"], answer: 0 },
            { q: "What is Model Pruning?", options: ["Automatically removing obsolete models", "Trimming trees", "Optimizing database", "Deleting users"], answer: 0 },
            { q: "What is Lazy Loading in Eloquent?", options: ["Loading relationships only when accessed", "Loading slowly", "Loading all at once", "Not loading"], answer: 0 },
            { q: "What is Eager Loading?", options: ["Loading relationships alongside the main model to solve N+1 problem", "Loading fast", "Loading later", "Loading manually"], answer: 0 },
            { q: "What is the N+1 Query Problem?", options: ["Executing N additional queries to fetch a relationship for N models", "A math problem", "A database error", "A routing issue"], answer: 0 },
            { q: "How do you prevent N+1 problem?", options: ["Use with() method", "Use load() method", "Both A and B", "Use join()"], answer: 2 },
            { q: "What is Database Seeding?", options: ["Populating database with initial/test data", "Planting trees", "Creating tables", "Backing up data"], answer: 0 },
            { q: "What is a Factory in Laravel?", options: ["A way to generate fake data for models", "A building", "A controller", "A route"], answer: 0 },
            { q: "What is Mocking in Testing?", options: ["Simulating the behavior of objects", "Making fun of code", "Copying code", "Deleting code"], answer: 0 },
            { q: "What is HTTP Client in Laravel?", options: ["A wrapper around Guzzle for making outgoing HTTP requests", "A browser", "A server", "A route"], answer: 0 },
            { q: "What is the 'stub' file?", options: ["A template used for generating code", "A ticket", "A short file", "A log"], answer: 0 },
            { q: "What is Laravel Octane?", options: ["Supercharges application performance using Swoole or RoadRunner", "A fuel", "A database", "A frontend tool"], answer: 0 },

            // --- Security & Ecosystem (20) ---
            { q: "What is CSRF?", options: ["Cross-Site Request Forgery", "Cross-Site Reference File", "Cascading Style Sheet", "Computer Security Risk Factor"], answer: 0 },
            { q: "How does Laravel protect against CSRF?", options: ["Using CSRF tokens", "Blocking all requests", "Using HTTPS", "Using passwords"], answer: 0 },
            { q: "What is XSS?", options: ["Cross-Site Scripting", "Extra Small Style", "XML Style Sheet", "X-ray System Scan"], answer: 0 },
            { q: "How do you escape output in Blade?", options: ["{{ $var }}", "{!! $var !!}", "<?= $var ?>", "echo $var"], answer: 0 },
            { q: "What is SQL Injection?", options: ["Inserting malicious SQL into queries", "A database feature", "A plugin", "A theme"], answer: 0 },
            { q: "How does Eloquent prevent SQL Injection?", options: ["Using PDO parameter binding", "It doesn't", "Using firewalls", "Using magic"], answer: 0 },
            { q: "What is Hashing?", options: ["One-way transformation of data (e.g., passwords)", "Encryption", "Compression", "Sorting"], answer: 0 },
            { q: "Which facade is used for hashing?", options: ["Hash", "Crypt", "Security", "Auth"], answer: 0 },
            { q: "What is Encryption?", options: ["Two-way transformation of data using a key", "Hashing", "Deleting", "Hiding"], answer: 0 },
            { q: "Which facade is used for encryption?", options: ["Crypt", "Hash", "Encrypt", "Security"], answer: 0 },
            { q: "What is Laravel Forge?", options: ["Server management and deployment service", "A blacksmith", "A code editor", "A database"], answer: 0 },
            { q: "What is Laravel Vapor?", options: ["Serverless deployment platform for Laravel (AWS Lambda)", "A gas", "A cloud", "A tool"], answer: 0 },
            { q: "What is Laravel Envoy?", options: ["A tool for executing common tasks on remote servers", "A diplomat", "A ship", "A router"], answer: 0 },
            { q: "What is Laravel Socialite?", options: ["OAuth authentication with Facebook, Google, etc.", "A social network", "A plugin", "A theme"], answer: 0 },
            { q: "What is Laravel Cashier?", options: ["Subscription billing interface (Stripe/Paddle)", "A bank", "A shop", "A wallet"], answer: 0 },
            { q: "What is Laravel Scout?", options: ["Full-text search for Eloquent models", "A boy scout", "A map", "A compass"], answer: 0 },
            { q: "What is Laravel Dusk?", options: ["Browser automation and testing", "Twilight", "A theme", "A plugin"], answer: 0 },
            { q: "What is Laravel Jetstream?", options: ["Application starter kit with login, registration, etc.", "A plane", "A stream", "A river"], answer: 0 },
            { q: "What is Laravel Breeze?", options: ["Minimal authentication starter kit", "A wind", "A fan", "A cooler"], answer: 0 },
            { q: "What is Livewire?", options: ["Full-stack framework for Laravel to build dynamic UIs", "A wire", "A cable", "A plug"], answer: 0 }
        ];

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            const quizContainer = document.getElementById('quiz');
            const scoreDisplay = document.getElementById('score-display');
            const progressBar = document.getElementById('progress');
            let score = 0;
            let answeredCount = 0;

            // Shuffle questions
            shuffleArray(questions);

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                
                const title = document.createElement('h3');
                title.textContent = `${index + 1}. ${q.q}`;
                qEl.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                let optionsWithIndices = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                shuffleArray(optionsWithIndices);

                optionsWithIndices.forEach(optObj => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.textContent = optObj.text;
                    
                    btn.onclick = () => {
                        if (optionsDiv.classList.contains('answered')) return;
                        
                        optionsDiv.classList.add('answered');
                        answeredCount++;
                        
                        const progressPercent = (answeredCount / questions.length) * 100;
                        progressBar.style.width = `${progressPercent}%`;

                        if (optObj.originalIndex === q.answer) {
                            score++;
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('incorrect');
                        }

                        Array.from(optionsDiv.children).forEach(child => {
                            if (child.textContent === q.options[q.answer]) {
                                child.classList.add('correct');
                            } else if (child !== btn) {
                                child.classList.add('dimmed');
                            }
                        });

                        scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
                    };
                    
                    optionsDiv.appendChild(btn);
                });

                qEl.appendChild(optionsDiv);
                quizContainer.appendChild(qEl);
            });
            
            scoreDisplay.textContent = `Score: 0 / ${questions.length}`;
        }

        initQuiz();
    </script>
</body>
</html>
