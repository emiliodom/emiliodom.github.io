<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Flashcards</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
  <style>
    :root {
      --bg-color: #0f172a;
      --card-color: rgba(30, 41, 59, 0.8);
      --text-color: #e2e8f0;
      --secondary-text: #94a3b8;
      --accent-color: #38bdf8;
      --border: rgba(148, 163, 184, 0.18);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(980px, 100%);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    .sub {
      color: var(--secondary-text);
      margin: 6px 0 0;
      line-height: 1.45;
      font-size: 13px;
    }

    a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 220px 200px auto auto;
      gap: 10px;
      margin: 14px 0;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.35);
      color: var(--text-color);
      outline: none;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      border-color: rgba(56, 189, 248, 0.35);
    }

    .meta {
      color: var(--secondary-text);
      font-size: 13px;
      margin: 8px 0 14px;
    }

    .card {
      user-select: none;
      background: var(--card-color);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      min-height: 260px;
      display: grid;
      gap: 10px;
    }

    .card-slider {
      margin-top: 4px;
    }

    .card-slide {
      display: grid;
      gap: 10px;
      min-height: 190px;
    }

    /* Fallback (no slick loaded): show one side based on data-side */
    .card-slider:not(.slick-initialized) .card-slide { display: none; }
    .card[data-side="front"] .card-slider:not(.slick-initialized) .card-slide.front-slide { display: grid; }
    .card[data-side="back"] .card-slider:not(.slick-initialized) .card-slide.back-slide { display: grid; }

    /* Make slick slides fill the card nicely */
    .slick-list, .slick-track { height: 100%; }

    .pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(56, 189, 248, 0.14);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.22);
      width: fit-content;
    }

    .front {
      font-size: 18px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .back {
      color: var(--text-color);
      line-height: 1.55;
    }

    .back .label {
      color: var(--secondary-text);
      font-size: 12px;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .hint {
      margin-top: 8px;
      color: var(--secondary-text);
      font-size: 13px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .nav-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.35);
      color: var(--text-color);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link:hover {
      border-color: rgba(56, 189, 248, 0.35);
    }

    @media (max-width: 540px) {
      body { padding: 14px; }
      .card { padding: 14px; }
      .front { font-size: 16px; }
      .nav { justify-content: center; }
    }

    @media (max-width: 860px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Flashcards (Hard Concepts + Analogies)</h1>
        <p class="sub">Click the card to flip. Use these to build intuition fast. Back side includes an analogy + an “easy similarity”.</p>
      </div>
      <div>
        <a href="./index.html">← Back to Interview Questions</a>
        <span style="color: rgba(148, 163, 184, 0.7);"> | </span>
        <a href="./code_challenges.html">Code Challenges →</a>
      </div>
    </div>

    <div class="controls">
      <input id="search" placeholder="Search (e.g., cache stampede, nonce, LSP, event loop…)" />
      <input id="topicSearch" placeholder="Filter topics (e.g., CSS, Security…)" />
      <select id="topic"></select>
      <button id="shuffleBtn" type="button">Shuffle</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>

    <div class="meta" id="meta"></div>

    <div class="card" id="card" data-side="front" tabindex="0" role="button" aria-label="Flashcard (click to flip)">
      <span class="pill" id="pill">Loading…</span>
      <div class="card-slider" id="cardSlider" aria-label="Flashcard sides">
        <div class="card-slide front-slide">
          <div class="front" id="front">Loading…</div>
          <div class="hint" id="hint">Tip: Try answering out loud before flipping.</div>
        </div>
        <div class="card-slide back-slide">
          <div class="back" id="back"></div>
        </div>
      </div>
    </div>

    <div class="nav" aria-label="Flashcard navigation">
      <div class="nav-group">
        <button id="prevBtn" type="button">Prev</button>
        <button id="nextBtn" type="button">Next</button>
        <button id="flipBtn" type="button">Flip</button>
      </div>
      <div class="nav-group">
        <a class="nav-link" href="./index.html">Questions</a>
        <a class="nav-link" href="./projects.html">Projects</a>
        <a class="nav-link" href="./code_challenges.html">Challenges</a>
      </div>
    </div>
  </div>

  <script src="./wordpress_dev_flashcards_bank.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script>
    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = () => resolve(true);
        s.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(s);
      });
    }

    async function ensureFlashcardsBank() {
      if (window.INTERVIEW_FLASHCARDS_BANK && Array.isArray(window.INTERVIEW_FLASHCARDS_BANK.cards)) return;

      // Fallbacks to handle path/caching issues on GitHub Pages.
      const candidates = [
        './wordpress_dev_flashcards_bank.min.js',
        '/interview_guide/wordpress_dev_flashcards_bank.min.js',
        './wordpress_dev_flashcards_bank.js',
        '/interview_guide/wordpress_dev_flashcards_bank.js'
      ];

      for (const src of candidates) {
        try {
          await loadScript(src);
          if (window.INTERVIEW_FLASHCARDS_BANK && Array.isArray(window.INTERVIEW_FLASHCARDS_BANK.cards)) return;
        } catch (e) {
          // keep trying
        }
      }
    }

    function initSlickFlip() {
      const slider = document.getElementById('cardSlider');
      if (!slider) return false;
      if (!(window.jQuery && window.jQuery.fn && typeof window.jQuery.fn.slick === 'function')) return false;
      const $ = window.jQuery;
      const $slider = $(slider);
      if ($slider.hasClass('slick-initialized')) return true;

      $slider.slick({
        arrows: false,
        dots: false,
        infinite: false,
        swipe: false,
        draggable: false,
        adaptiveHeight: true,
        fade: true,
        speed: 260,
        cssEase: 'cubic-bezier(0.2, 0.8, 0.2, 1)'
      });
      return true;
    }

    function setSide(side) {
      const cardEl = document.getElementById('card');
      const slider = document.getElementById('cardSlider');
      if (!cardEl || !slider) return;
      const next = side === 'back' ? 'back' : 'front';
      cardEl.dataset.side = next;

      if (window.jQuery && window.jQuery.fn && typeof window.jQuery.fn.slick === 'function') {
        const $ = window.jQuery;
        const $slider = $(slider);
        if ($slider.hasClass('slick-initialized')) {
          $slider.slick('slickGoTo', next === 'front' ? 0 : 1, true);
        }
      }
    }

    function getSide() {
      const cardEl = document.getElementById('card');
      return (cardEl && cardEl.dataset && cardEl.dataset.side) ? cardEl.dataset.side : 'front';
    }

    let bank = window.INTERVIEW_FLASHCARDS_BANK || {};
    let cards = (bank && Array.isArray(bank.cards)) ? bank.cards : [];
    let groups = (bank && Array.isArray(bank.groups)) ? bank.groups : [];
    let totalTopicsCount = new Set(cards.map(c => c.topic)).size;

    let filtered = [...cards];
    let index = 0;

    function uniqueTopics() {
      const groupLabels = groups.map(g => g.label).filter(Boolean);
      const topics = Array.from(new Set(cards.map(c => c.topic))).sort();
      return ['All', ...groupLabels, ...topics];
    }

    function renderTopicOptions() {
      const topicSel = document.getElementById('topic');
      const query = document.getElementById('topicSearch').value.trim().toLowerCase();

      const prevSelection = topicSel.value || 'All';
      const options = uniqueTopics().filter(t => {
        if (t === 'All') return true;
        if (!query) return true;
        return String(t).toLowerCase().includes(query);
      });

      topicSel.innerHTML = options.map(t => `<option value="${t}">${t}</option>`).join('');

      if (options.includes(prevSelection)) {
        topicSel.value = prevSelection;
      } else {
        topicSel.value = 'All';
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const t = document.getElementById('topic').value;

      const selectedGroup = groups.find(g => g.label === t);
      const groupTopics = selectedGroup ? (selectedGroup.topics || []) : null;

      filtered = cards.filter(c => {
        if (t !== 'All') {
          if (groupTopics) {
            if (!groupTopics.includes(c.topic)) return false;
          } else {
            if (c.topic !== t) return false;
          }
        }
        if (!q) return true;
        const hay = `${c.topic} ${c.front} ${c.answer} ${c.analogy} ${c.similarity}`.toLowerCase();
        return hay.includes(q);
      });

      index = 0;
      render();
    }

    function render() {
      const meta = document.getElementById('meta');
      const pill = document.getElementById('pill');
      const front = document.getElementById('front');
      const back = document.getElementById('back');
      const cardEl = document.getElementById('card');

      if (!filtered.length) {
        meta.textContent = 'No cards match your filter.';
        pill.textContent = '—';
        front.textContent = 'Try a different topic/search.';
        back.innerHTML = '';
        setSide('front');
        return;
      }

      const c = filtered[index];
      meta.textContent = `Card ${index + 1} of ${filtered.length} (Total library: ${cards.length} • Topics: ${totalTopicsCount})`;
      pill.textContent = c.topic;
      front.textContent = c.front;
      back.innerHTML = `
        <div><strong>Answer:</strong> ${c.answer}</div>
        <div class="label">Analogy</div>
        <div>${c.analogy}</div>
        <div class="label">Easy Similarity</div>
        <div>${c.similarity}</div>
      `;
      setSide('front');
    }

    function next() {
      if (!filtered.length) return;
      index = (index + 1) % filtered.length;
      render();
    }

    function prev() {
      if (!filtered.length) return;
      index = (index - 1 + filtered.length) % filtered.length;
      render();
    }

    function flip() {
      setSide(getSide() === 'front' ? 'back' : 'front');
    }

    function reset() {
      document.getElementById('search').value = '';
      document.getElementById('topicSearch').value = '';
      renderTopicOptions();
      document.getElementById('topic').value = 'All';
      filtered = [...cards];
      index = 0;
      render();
    }

    async function init() {
      await ensureFlashcardsBank();
      bank = window.INTERVIEW_FLASHCARDS_BANK || {};
      cards = (bank && Array.isArray(bank.cards)) ? bank.cards : [];
      groups = (bank && Array.isArray(bank.groups)) ? bank.groups : [];
      totalTopicsCount = new Set(cards.map(c => c.topic)).size;
      filtered = [...cards];

      if (!cards.length) {
        console.warn('Flashcards bank did not load. Expected window.INTERVIEW_FLASHCARDS_BANK.cards.');
        const meta = document.getElementById('meta');
        if (meta) meta.textContent = 'Flashcards data did not load (bank file missing or blocked).';
      }

      const topicSel = document.getElementById('topic');
      renderTopicOptions();

      // Initialize slick after DOM is ready; fallback works if CDN fails.
      initSlickFlip();
      setSide('front');

      document.getElementById('search').addEventListener('input', applyFilters);
      document.getElementById('topicSearch').addEventListener('input', () => {
        renderTopicOptions();
        applyFilters();
      });
      topicSel.addEventListener('change', applyFilters);

      document.getElementById('shuffleBtn').addEventListener('click', () => {
        shuffle(filtered);
        index = 0;
        render();
      });
      document.getElementById('resetBtn').addEventListener('click', reset);
      document.getElementById('nextBtn').addEventListener('click', next);
      document.getElementById('prevBtn').addEventListener('click', prev);
      document.getElementById('flipBtn').addEventListener('click', flip);

      const cardEl = document.getElementById('card');
      cardEl.addEventListener('click', flip);
      cardEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          flip();
        }
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
      });

      render();
    }

    init();
  </script>
</body>
</html>
