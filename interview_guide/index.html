        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --secondary-text: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #020617;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .topic-btn {
            background: none;
            border: none;
            color: var(--secondary-text);
            text-align: left;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 6px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .topic-btn:hover, .topic-btn.active {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .category-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: #334155;
            border: 2px solid #334155;
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
        }

        .option-btn.correct {
            background-color: rgba(34, 197, 94, 0.2);
            border-color: var(--success-color);
            color: var(--success-color);
        }

        .option-btn.wrong {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-next {
            background-color: var(--accent-color);
            color: #0f172a;
        }
        
        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            position: absolute;
            top: 20px;
            right: 40px;
            color: var(--secondary-text);
        }

        .explanation {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(148, 163, 184, 0.08);
            color: var(--secondary-text);
            line-height: 1.5;
            display: none;
        }

        .quality-panel {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 24px;
        }

        .quality-panel.visible {
            display: flex;
        }

        .quality-modal {
            width: min(980px, 100%);
            max-height: min(82vh, 900px);
            overflow: auto;
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 14px;
            padding: 18px;
        }

        .quality-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .quality-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .quality-meta {
            color: var(--secondary-text);
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.45;
        }

        .quality-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .quality-table th,
        .quality-table td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            vertical-align: top;
            font-size: 13px;
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            background: rgba(56, 189, 248, 0.14);
            color: #bae6fd;
            border: 1px solid rgba(56, 189, 248, 0.22);
            margin-left: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; height: auto; max-height: 200px; }
            .main { padding: 20px; }
        }

        q: "True or False: You can have multiple `<h1>` tags on a page according to HTML5 standards (though typically not recommended for SEO).",
        options: ["True", "False"],
        a: 0
    },
    {
        topic: "Rapid Fire",
        q: "True or False: React state updates are always synchronous.",
        options: ["True", "False (They are often asynchronous/batched)"],
        a: 1
    },
    {
        topic: "Rapid Fire",
        q: "True or False: A `transient` with an expiration of 0 seconds never expires.",
        options: ["True", "False"],
        a: 1,
        explain: "This is a trick: in WP options, 0 often means 'no expiration', but for transients you should treat 0 as 'don’t use transients for permanence' (behavior/assumptions vary). Prefer an option for permanent storage, or set a real TTL for transients."
    },
    {
        topic: "Rapid Fire",
        q: "Can you define a constant in PHP using `const` inside an `if` block?",
        options: [
            "Yes",
            "No, `const` is compile-time. Use `define()` for runtime definitions."
        ],
        a: 1
    },
    {
        topic: "Rapid Fire",
        q: "Does `empty('0')` return true or false in PHP?",
        options: ["True", "False"],
        a: 0
    }

        ];

        // --- DUPLICATE/AUGMENT DATA TO SIMULATE SCALE IF NEEDED ---
        // For a real app, you would add more distinct questions here. 
        // I will duplicate the logic to ensure the "shuffle" feels robust for the demo.
        let questions = [...rawData]; 
        
        // --- APP STATE ---
        let currentTopic = 'All';
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalAnswered = 0;
        let quizMode = 'topic'; // 'topic' | 'assessment'
        const ASSESSMENT_SIZE = 60;

        // --- INITIALIZATION ---
        function init() {
            renderSidebar();
            filterQuestions();
            updateStats();
        }

        // --- CORE LOGIC ---
        function getTopics() {
            const topics = new Set(questions.map(q => q.topic));
            return Array.from(topics).sort();
        }

        function getTopicCounts() {
            const counts = new Map();
            questions.forEach(q => {
                const t = q.topic || 'Uncategorized';
                counts.set(t, (counts.get(t) || 0) + 1);
            });
            return counts;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            const topics = getTopics();
            const counts = getTopicCounts();

            // Update the static "All Topics" button label to include total count
            const allBtn = document.getElementById('allTopicsBtn');
            if (allBtn) {
                allBtn.dataset.topic = 'All';
                allBtn.innerText = `All Topics (${questions.length})`;
            }

            const assessBtn = document.getElementById('assessmentBtn');
            if (assessBtn) {
                const n = Math.min(ASSESSMENT_SIZE, questions.length);
                assessBtn.dataset.topic = 'Assessment60';
                assessBtn.innerText = `60Q Assessment (${n})`;
            }

            // Remove previously-rendered topic buttons (keep header + all button + flashcards link)
            sidebar.querySelectorAll('button.topic-btn[data-dynamic="true"]').forEach(el => el.remove());
            
            topics.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'topic-btn';
                btn.dataset.dynamic = 'true';
                btn.dataset.topic = t;
                const count = counts.get(t) || 0;
                btn.innerText = `${t} (${count})`;
                btn.onclick = () => setTopic(t);
                sidebar.appendChild(btn);
            });
        }

        function setTopic(topic) {
            quizMode = 'topic';
            currentTopic = topic;
            
            // Update active button
            document.querySelectorAll('.topic-btn').forEach(b => {
                b.classList.remove('active');
                const bTopic = b.dataset ? b.dataset.topic : null;
                if (bTopic && bTopic === topic) b.classList.add('active');
            });

            filterQuestions();
        }

        function setActiveSidebarButton(key) {
            document.querySelectorAll('.topic-btn').forEach(b => {
                b.classList.remove('active');
                const bTopic = b.dataset ? b.dataset.topic : null;
                if (bTopic && bTopic === key) b.classList.add('active');
            });
        }

        function startAssessment() {
            quizMode = 'assessment';
            currentTopic = 'All';
            setActiveSidebarButton('Assessment60');

            const n = Math.min(ASSESSMENT_SIZE, questions.length);
            currentQuestions = sampleBalancedByTopic(questions, n);
            shuffleArray(currentQuestions);

            currentIndex = 0;
            score = 0;
            totalAnswered = 0;
            updateStats();
            loadQuestion();
        }

        function filterQuestions() {
            if (currentTopic === 'All') {
                currentQuestions = [...questions];
            } else {
                currentQuestions = questions.filter(q => q.topic === currentTopic);
            }
            shuffleArray(currentQuestions);
            currentIndex = 0;
            score = 0;
            totalAnswered = 0;
            updateStats();
            loadQuestion();
        }

        function loadQuestion() {
            const card = document.getElementById('card');
            const nextBtn = document.getElementById('nextBtn');
            const progressBar = document.getElementById('progressBar');
            const explanation = document.getElementById('explanation');
            
            // Reset UI
            card.classList.remove('shake');
            nextBtn.disabled = true;
            if (explanation) {
                explanation.style.display = 'none';
                explanation.innerText = '';
            }

            if (currentIndex >= currentQuestions.length) {
                showResults();
                return;
            }

            const qData = currentQuestions[currentIndex];
            
            // Render Text
            document.getElementById('categoryBadge').innerText = qData.topic;
            document.getElementById('questionText').innerText = qData.q;
            
            // Shuffle and Render Options
            const optionsDiv = document.getElementById('optionsGrid');
            optionsDiv.innerHTML = '';
            
            // Map options to original index to track correct answer
            let optionsWithIndices = qData.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            shuffleArray(optionsWithIndices);

            optionsWithIndices.forEach(optObj => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optObj.text;
                btn.dataset.originalIndex = String(optObj.originalIndex);
                btn.onclick = () => checkAnswer(btn, optObj.originalIndex, qData.a);
                optionsDiv.appendChild(btn);
            });

            // Update Progress
            const pct = (currentIndex / currentQuestions.length) * 100;
            progressBar.style.width = `${pct}%`;
        }

        function checkAnswer(selectedBtn, selectedIndex, correctIndex) {
            // Disable all buttons
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            
            document.getElementById('nextBtn').disabled = false;
            totalAnswered++;

            if (selectedIndex === correctIndex) {
                // Correct
                selectedBtn.classList.add('correct');
                score++;
                triggerConfetti();
            } else {
                // Wrong
                selectedBtn.classList.add('wrong');
            }

            // Highlight the correct answer deterministically (no text matching)
            buttons.forEach(b => {
                if (Number(b.dataset.originalIndex) === correctIndex) b.classList.add('correct');
            });

            // Show explanation if present (helps keep options short + reduce "longest option wins")
            const currentQ = currentQuestions[currentIndex];
            const explanation = document.getElementById('explanation');
            if (explanation && currentQ && currentQ.explain) {
                explanation.style.display = 'block';
                explanation.innerText = currentQ.explain;
            }

            updateStats();
        }

        // --- QUIZ QUALITY (ANTI-BIAS) ---
        function normalizeTextForLength(s) {
            return String(s || '')
                .replace(/`+/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function optionLengthScore(s) {
            // Weighted: characters matter; words matter; code ticks removed above.
            const t = normalizeTextForLength(s);
            const words = t ? t.split(/\s+/).length : 0;
            return {
                chars: t.length,
                words,
            };
        }

        function median(nums) {
            const arr = [...nums].sort((a, b) => a - b);
            if (!arr.length) return 0;
            const mid = Math.floor(arr.length / 2);
            return arr.length % 2 ? arr[mid] : (arr[mid - 1] + arr[mid]) / 2;
        }

        function analyzeQuestion(q) {
            const opts = Array.isArray(q.options) ? q.options : [];
            if (!opts.length || typeof q.a !== 'number') return null;

            const lengths = opts.map(o => optionLengthScore(o).chars);
            const correctLen = lengths[q.a] ?? 0;
            const maxLen = Math.max(...lengths);
            const minLen = Math.min(...lengths);
            const med = median(lengths);

            const correctIsLongest = correctLen === maxLen;
            const spread = maxLen - minLen;
            const ratio = med > 0 ? (correctLen / med) : 0;

            // Heuristics: flag when the correct option is the longest AND significantly longer than the median.
            // Also flag when spread is large (visual giveaway), even if correct isn't the max.
            const suspicious = (correctIsLongest && ratio >= 1.35 && spread >= 25) || (spread >= 60);

            return {
                correctIsLongest,
                correctLen,
                medianLen: med,
                spread,
                ratio,
                suspicious,
            };
        }

        function renderQualityReport() {
            const meta = document.getElementById('qualityMeta');
            const content = document.getElementById('qualityContent');
            if (!meta || !content) return;

            const byTopic = new Map();
            const suspiciousItems = [];

            questions.forEach((q, idx) => {
                const analysis = analyzeQuestion(q);
                if (!analysis) return;

                const topic = q.topic || 'Uncategorized';
                const current = byTopic.get(topic) || { total: 0, correctLongest: 0, suspicious: 0 };
                current.total++;
                if (analysis.correctIsLongest) current.correctLongest++;
                if (analysis.suspicious) {
                    current.suspicious++;
                    suspiciousItems.push({ idx, topic, q, analysis });
                }
                byTopic.set(topic, current);
            });

            const totals = Array.from(byTopic.values()).reduce(
                (acc, v) => {
                    acc.total += v.total;
                    acc.correctLongest += v.correctLongest;
                    acc.suspicious += v.suspicious;
                    return acc;
                },
                { total: 0, correctLongest: 0, suspicious: 0 }
            );

            const pctLongest = totals.total ? Math.round((totals.correctLongest / totals.total) * 100) : 0;
            const pctSuspicious = totals.total ? Math.round((totals.suspicious / totals.total) * 100) : 0;

            meta.innerHTML = `
                <div><strong>Total questions:</strong> ${totals.total}</div>
                <div><strong>Correct option is the longest:</strong> ${pctLongest}% (${totals.correctLongest}/${totals.total})</div>
                <div><strong>Suspicious length spread/ratio:</strong> ${pctSuspicious}% (${totals.suspicious}/${totals.total})</div>
                <div style="margin-top:8px;">Tip: keep options similar length; move detail into <code>explain</code> (shown after answering).</div>
            `;

            const topicRows = Array.from(byTopic.entries())
                .sort((a, b) => b[1].total - a[1].total)
                .map(([topic, v]) => {
                    const longestPct = v.total ? Math.round((v.correctLongest / v.total) * 100) : 0;
                    return `
                        <tr>
                            <td>${topic}</td>
                            <td>${v.total}</td>
                            <td>${longestPct}%</td>
                            <td>${v.suspicious}</td>
                        </tr>
                    `;
                })
                .join('');

            const topSuspicious = suspiciousItems
                .sort((a, b) => (b.analysis.ratio - a.analysis.ratio) || (b.analysis.spread - a.analysis.spread))
                .slice(0, 30)
                .map(item => {
                    const qText = normalizeTextForLength(item.q.q).slice(0, 180);
                    const ratio = item.analysis.ratio.toFixed(2);
                    return `
                        <tr>
                            <td><span class="pill">${item.topic}</span></td>
                            <td>${qText}${item.q.q.length > 180 ? '…' : ''}</td>
                            <td>${item.analysis.correctLen}</td>
                            <td>${Math.round(item.analysis.medianLen)}</td>
                            <td>${item.analysis.spread}</td>
                            <td>${ratio}</td>
                        </tr>
                    `;
                })
                .join('');

            content.innerHTML = `
                <h4 style="margin:10px 0 6px;">Per-topic stats</h4>
                <table class="quality-table">
                    <thead>
                        <tr>
                            <th>Topic</th>
                            <th>Questions</th>
                            <th>% correct is longest</th>
                            <th>Suspicious questions</th>
                        </tr>
                    </thead>
                    <tbody>${topicRows}</tbody>
                </table>

                <h4 style="margin:16px 0 6px;">Top suspicious questions (by length giveaway)</h4>
                <table class="quality-table">
                    <thead>
                        <tr>
                            <th>Topic</th>
                            <th>Question</th>
                            <th>Correct chars</th>
                            <th>Median chars</th>
                            <th>Spread</th>
                            <th>Ratio</th>
                        </tr>
                    </thead>
                    <tbody>${topSuspicious || '<tr><td colspan="6">No suspicious questions detected 🎉</td></tr>'}</tbody>
                </table>
            `;
        }

        function toggleQuality(force) {
            const panel = document.getElementById('qualityPanel');
            if (!panel) return;
            const shouldOpen = typeof force === 'boolean' ? force : !panel.classList.contains('visible');
            if (shouldOpen) {
                renderQualityReport();
                panel.classList.add('visible');
            } else {
                panel.classList.remove('visible');
            }
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        function resetQuiz() {
            if (quizMode === 'assessment') {
                startAssessment();
            } else {
                filterQuestions();
            }
        }

        function showResults() {
            const card = document.getElementById('card');
            const pct = Math.round((score / totalAnswered) * 100) || 0;
            
            const primaryLabel = quizMode === 'assessment' ? 'Restart Assessment' : 'Restart Topic';
            const subtitle = quizMode === 'assessment' ? `Assessment Complete (${totalAnswered} questions)` : 'Quiz Finished!';

            card.innerHTML = `
                <span class="category-badge">Complete</span>
                <div class="question-text">
                    ${subtitle} <br>
                    You scored ${score} out of ${totalAnswered} (${pct}%)
                </div>
                <div class="options-grid">
                    <button class="option-btn" onclick="resetQuiz()">${primaryLabel}</button>
                    <button class="option-btn" onclick="setTopic('All')">Try Another Topic</button>
                </div>
            `;
            
            if(pct > 80) triggerConfetti();
        }

        function updateStats() {
            document.getElementById('stats').innerText = `Score: ${score} / ${totalAnswered}`;
        }

        // --- UTILS ---
        function sampleWithoutReplacement(array, n) {
            const copy = [...array];
            const take = Math.min(n, copy.length);
            for (let i = 0; i < take; i++) {
                const j = i + Math.floor(Math.random() * (copy.length - i));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy.slice(0, take);
        }

        function sampleBalancedByTopic(allQuestions, n) {
            const groups = new Map();
            (allQuestions || []).forEach(q => {
                const t = q.topic || 'Uncategorized';
                if (!groups.has(t)) groups.set(t, []);
                groups.get(t).push(q);
            });

            const topics = Array.from(groups.keys()).sort();
            if (!topics.length) return [];

            const target = Math.min(n, allQuestions.length);
            const base = Math.floor(target / topics.length);

            // Prepare per-topic pools (shuffled copies) so selection is random within each topic.
            const pools = new Map();
            topics.forEach(t => {
                const pool = [...groups.get(t)];
                shuffleArray(pool);
                pools.set(t, pool);
            });

            const picked = [];

            // Base allocation: roughly equal per topic
            topics.forEach(t => {
                const pool = pools.get(t) || [];
                const take = Math.min(base, pool.length);
                for (let i = 0; i < take; i++) picked.push(pool.pop());
            });

            // Redistribute leftover slots round-robin across topics that still have questions.
            while (picked.length < target) {
                const availableTopics = topics.filter(t => (pools.get(t) || []).length > 0);
                if (!availableTopics.length) break;

                // Shuffle available topics each round to avoid always favoring early topics.
                shuffleArray(availableTopics);
                for (const t of availableTopics) {
                    if (picked.length >= target) break;
                    const pool = pools.get(t);
                    if (pool && pool.length) picked.push(pool.pop());
                }
            }

            return picked;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#38bdf8', '#22c55e', '#ffffff']
            });
        }

        // Run
        init();

    </script>
