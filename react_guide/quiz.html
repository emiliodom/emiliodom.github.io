<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/react_styles.css">
    <script src="../assets/js/react_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>React Final Assessment</h1>
        <p>Test your knowledge from Beginner to Senior React Developer.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Beginner (20) ---
            { q: "What is the virtual DOM?", options: ["A direct copy of the real DOM", "A lightweight JavaScript representation of the DOM", "A browser plugin", "A database for React"], answer: 1 },
            { q: "Which hook is used to manage state in a functional component?", options: ["useEffect", "useContext", "useState", "useReducer"], answer: 2 },
            { q: "How do you pass data from a parent to a child component?", options: ["State", "Props", "Context", "Redux"], answer: 1 },
            { q: "What is the correct syntax to render a list of items?", options: ["items.forEach()", "items.map()", "for loop", "items.filter()"], answer: 1 },
            { q: "What is the purpose of the 'key' prop in lists?", options: ["To style the element", "To uniquely identify elements for efficient updates", "To access the DOM node", "To pass data to the child"], answer: 1 },
            { q: "Which hook is used to perform side effects?", options: ["useState", "useMemo", "useEffect", "useCallback"], answer: 2 },
            { q: "What is JSX?", options: ["JavaScript XML", "Java Syntax Extension", "JSON XML", "JavaScript XSLT"], answer: 0 },
            { q: "How do you handle events in React?", options: ["onclick='handler()'", "onClick={handler}", "ng-click='handler'", "v-on:click='handler'"], answer: 1 },
            { q: "What is a controlled component?", options: ["A component controlled by Redux", "A component where form data is handled by React state", "A component with no state", "A component that controls others"], answer: 1 },
            { q: "What is the default return value of useEffect?", options: ["The state", "A cleanup function or undefined", "The component", "A promise"], answer: 1 },
            { q: "Can you use hooks in class components?", options: ["Yes", "No", "Only useState", "Only useEffect"], answer: 1 },
            { q: "What is the purpose of React.Fragment?", options: ["To create a new DOM node", "To group children without adding extra nodes to the DOM", "To split code", "To memoize components"], answer: 1 },
            { q: "How do you conditionally render an element?", options: ["if-else inside JSX", "Ternary operator or logical &&", "switch-case inside JSX", "v-if"], answer: 1 },
            { q: "What is prop drilling?", options: ["Passing props through multiple levels of components", "Validating props", "Modifying props", "Deleting props"], answer: 0 },
            { q: "Which hook is used to access the Context API?", options: ["useContext", "useProvider", "useGlobal", "useState"], answer: 0 },
            { q: "What is the second argument of useEffect used for?", options: ["Cleanup", "Dependency array", "Initial state", "Callback"], answer: 1 },
            { q: "How do you create a ref in a functional component?", options: ["React.createRef()", "useRef()", "this.refs", "ref()"], answer: 1 },
            { q: "What does 'lifting state up' mean?", options: ["Moving state to Redux", "Moving state to a common ancestor", "Deleting state", "Using context"], answer: 1 },
            { q: "What is the purpose of React.StrictMode?", options: ["To enforce types", "To highlight potential problems in an application", "To optimize performance", "To prevent errors"], answer: 1 },
            { q: "How do you import React in a file?", options: ["import React from 'react'", "require('react')", "include React", "import { React } from 'react'"], answer: 0 },

            // --- Intermediate (20) ---
            { q: "What is the difference between useMemo and useCallback?", options: ["useMemo memoizes a value, useCallback memoizes a function", "They are the same", "useMemo is for side effects", "useCallback is for state"], answer: 0 },
            { q: "What is the Context API used for?", options: ["State management for global data", "Routing", "API calls", "Styling"], answer: 0 },
            { q: "What is a Higher-Order Component (HOC)?", options: ["A component that returns another component", "A component with high priority", "A parent component", "A Redux store"], answer: 0 },
            { q: "What is the purpose of useReducer?", options: ["To handle complex state logic", "To reduce array size", "To replace Redux", "To optimize rendering"], answer: 0 },
            { q: "How do you optimize performance for a functional component?", options: ["React.memo", "shouldComponentUpdate", "PureComponent", "useMemo"], answer: 0 },
            { q: "What is the 'children' prop?", options: ["The first child element", "All nested elements/components", "The parent component", "A specific data prop"], answer: 1 },
            { q: "How do you handle errors in React components?", options: ["try-catch blocks", "Error Boundaries", "onError prop", "useError hook"], answer: 1 },
            { q: "What is lazy loading in React?", options: ["Loading components only when needed", "Loading data slowly", "Delaying state updates", "Lazy evaluation of props"], answer: 0 },
            { q: "Which library is commonly used for routing in React?", options: ["React Router", "Vue Router", "Angular Router", "Express"], answer: 0 },
            { q: "What is the purpose of custom hooks?", options: ["To reuse stateful logic", "To create new UI components", "To override React hooks", "To fetch data"], answer: 0 },
            { q: "How do you prevent a component from re-rendering?", options: ["React.memo", "usePreventRender", "stopRender()", "It's impossible"], answer: 0 },
            { q: "What is the difference between controlled and uncontrolled components?", options: ["Controlled uses state, uncontrolled uses refs", "Controlled uses refs, uncontrolled uses state", "There is no difference", "Uncontrolled is deprecated"], answer: 0 },
            { q: "What is the purpose of ReactDOM.createPortal?", options: ["To render children into a DOM node outside the parent hierarchy", "To create a new window", "To teleport data", "To optimize rendering"], answer: 0 },
            { q: "How do you fetch data in React?", options: ["useEffect + fetch/axios", "componentDidMount", "useFetch", "All of the above"], answer: 0 },
            { q: "What is the rule of hooks?", options: ["Only call hooks at the top level", "Only call hooks inside loops", "Only call hooks in class components", "There are no rules"], answer: 0 },
            { q: "What is the purpose of the dependency array in useEffect?", options: ["To control when the effect runs", "To store data", "To pass props", "To define state"], answer: 0 },
            { q: "How do you share logic between components without HOCs or Render Props?", options: ["Custom Hooks", "Mixins", "Inheritance", "Copy-paste"], answer: 0 },
            { q: "What is the Flux architecture?", options: ["Unidirectional data flow", "Bidirectional data binding", "MVC pattern", "Database schema"], answer: 0 },
            { q: "What is Redux?", options: ["A predictable state container", "A database", "A routing library", "A styling framework"], answer: 0 },
            { q: "What is the purpose of 'dispatch' in Redux?", options: ["To send an action to the store", "To fetch data", "To update the UI", "To register a reducer"], answer: 0 },

            // --- Senior (20) ---
            { q: "How does React's reconciliation algorithm work?", options: ["Diffing algorithm comparing Virtual DOM trees", "Re-rendering the entire DOM", "Using shadow DOM", "Direct DOM manipulation"], answer: 0 },
            { q: "What is the significance of 'keys' in reconciliation?", options: ["Helps React identify which items have changed, added, or removed", "Sorts the list", "Styles the list", "Binds events"], answer: 0 },
            { q: "Explain the concept of 'Fiber' in React.", options: ["A reimplementation of the reconciliation engine", "A new styling library", "A database connector", "A type of hook"], answer: 0 },
            { q: "How would you optimize a large list rendering?", options: ["Virtualization (windowing)", "Pagination", "Infinite scroll", "All of the above"], answer: 3 },
            { q: "What is Server-Side Rendering (SSR) and why use it?", options: ["Rendering on the server for SEO and performance", "Rendering on the client", "Rendering in a service worker", "Rendering in the database"], answer: 0 },
            { q: "What is Static Site Generation (SSG)?", options: ["Generating HTML at build time", "Generating HTML at runtime", "Generating HTML on the client", "Generating HTML in the browser"], answer: 0 },
            { q: "How do you handle global state in a complex application?", options: ["Redux/Zustand/Context", "Local state everywhere", "Global variables", "LocalStorage"], answer: 0 },
            { q: "What are the performance implications of using Context API for frequent updates?", options: ["It can cause unnecessary re-renders of all consumers", "It is faster than Redux", "It has no impact", "It crashes the app"], answer: 0 },
            { q: "How do you test React components?", options: ["Jest + React Testing Library", "Mocha", "Selenium", "Manual testing"], answer: 0 },
            { q: "What is Code Splitting?", options: ["Splitting bundles to load only what's needed", "Splitting code into files", "Splitting components", "Splitting CSS"], answer: 0 },
            { q: "How does React handle synthetic events?", options: ["It wraps native events for cross-browser compatibility", "It uses native events directly", "It ignores events", "It uses jQuery events"], answer: 0 },
            { q: "What is the difference between Shadow DOM and Virtual DOM?", options: ["Shadow DOM is browser tech for scoping, Virtual DOM is React's diffing concept", "They are the same", "Virtual DOM is faster", "Shadow DOM is deprecated"], answer: 0 },
            { q: "How do you implement authentication in a React app?", options: ["JWT/Session tokens stored securely", "Hardcoded passwords", "Plain text cookies", "URL parameters"], answer: 0 },
            { q: "What is the purpose of useLayoutEffect?", options: ["Fires synchronously after all DOM mutations", "Fires asynchronously", "Fires before render", "Fires after paint"], answer: 0 },
            { q: "How do you handle race conditions in data fetching?", options: ["AbortController or ignoring stale responses", "setTimeout", "Promises", "Async/await"], answer: 0 },
            { q: "What is the 'render prop' pattern?", options: ["Sharing code using a prop whose value is a function", "Passing a component as a prop", "Rendering a prop", "Prop drilling"], answer: 0 },
            { q: "How do you secure a React application against XSS?", options: ["React escapes data by default, sanitize HTML if using dangerouslySetInnerHTML", "Disable JavaScript", "Use HTTPS", "Use Redux"], answer: 0 },
            { q: "What is hydration in the context of SSR?", options: ["Attaching event listeners to server-rendered HTML", "Drinking water", "Loading CSS", "Fetching data"], answer: 0 },
            { q: "How do you manage side effects in Redux?", options: ["Middleware (Thunk, Saga)", "Reducers", "Actions", "Components"], answer: 0 },
            { q: "What is the difference between shallow and deep rendering in testing?", options: ["Shallow renders one level deep, deep renders full tree", "Shallow is faster", "Deep is more accurate", "All of the above"], answer: 3 }
        ];

        // Shuffle questions
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const quizContainer = document.getElementById('quiz');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress');
        
        let shuffledQuestions = shuffle([...questions]);
        let score = 0;
        let answeredCount = 0;

        function renderQuiz() {
            quizContainer.innerHTML = '';
            shuffledQuestions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                qEl.innerHTML = `
                    <h3>${index + 1}. ${q.q}</h3>
                    <div class="options" id="opt-${index}">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="checkAnswer(${index}, ${i}, ${q.answer})">${opt}</div>
                        `).join('')}
                    </div>
                `;
                quizContainer.appendChild(qEl);
            });
            updateScore();
        }

        window.checkAnswer = function(qIndex, selected, correct) {
            const optionsDiv = document.getElementById(`opt-${qIndex}`);
            if (optionsDiv.classList.contains('answered')) return;

            optionsDiv.classList.add('answered');
            const options = optionsDiv.getElementsByClassName('option');
            
            if (selected === correct) {
                options[selected].classList.add('correct');
                score++;
            } else {
                options[selected].classList.add('incorrect');
                options[correct].classList.add('correct');
            }

            // Dim others
            for (let i = 0; i < options.length; i++) {
                if (i !== selected && i !== correct) {
                    options[i].classList.add('dimmed');
                }
            }

            answeredCount++;
            updateScore();
        };

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            const percent = (answeredCount / questions.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        renderQuiz();
    </script>
</body>
</html>
