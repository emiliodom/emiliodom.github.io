<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next.js Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/nextjs_styles.css">
    <script src="../assets/js/nextjs_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>Next.js Final Assessment</h1>
        <p>Test your knowledge from Beginner to Senior Next.js Developer.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Beginner (20) ---
            { q: "What is Next.js?", options: ["A React framework for production", "A database", "A CSS library", "A testing tool"], answer: 0 },
            { q: "Which folder is used for routing in the App Router?", options: ["app", "pages", "routes", "src"], answer: 0 },
            { q: "What is the file name for the main page of a route?", options: ["page.js", "index.js", "main.js", "route.js"], answer: 0 },
            { q: "How do you create a dynamic route?", options: ["[slug]", "{slug}", ":slug", "(slug)"], answer: 0 },
            { q: "What is the purpose of layout.js?", options: ["To define a shared UI for a segment and its children", "To define styles", "To configure the database", "To handle errors"], answer: 0 },
            { q: "What is the Link component used for?", options: ["Client-side navigation", "External links", "Styling", "Server requests"], answer: 0 },
            { q: "How do you add global CSS?", options: ["Import it in the root layout", "Import it in every file", "Use inline styles", "Use a script tag"], answer: 0 },
            { q: "What is the Image component used for?", options: ["Optimized image rendering", "Displaying SVGs", "Canvas drawing", "Uploading images"], answer: 0 },
            { q: "What is the default rendering method in Next.js App Router?", options: ["Server Components", "Client Components", "Static Generation", "SSR"], answer: 0 },
            { q: "How do you mark a component as a Client Component?", options: ["'use client'", "'use server'", "'client-side'", "It's automatic"], answer: 0 },
            { q: "What is the purpose of loading.js?", options: ["To show a loading UI while content loads", "To load scripts", "To optimize images", "To fetch data"], answer: 0 },
            { q: "What is the purpose of error.js?", options: ["To handle runtime errors in a route segment", "To log errors", "To show 404 pages", "To validate forms"], answer: 0 },
            { q: "What is the purpose of not-found.js?", options: ["To show a custom 404 page", "To handle 500 errors", "To redirect users", "To find files"], answer: 0 },
            { q: "How do you fetch data in a Server Component?", options: ["Async/await with fetch()", "useEffect", "useSWR", "getStaticProps"], answer: 0 },
            { q: "What is Metadata?", options: ["SEO information like title and description", "Database schema", "User data", "File size"], answer: 0 },
            { q: "How do you define metadata in a page?", options: ["Export a metadata object or generateMetadata function", "Use the Head component", "Use a meta tag", "Config file"], answer: 0 },
            { q: "What is the 'public' folder for?", options: ["Static assets like images and fonts", "Public code", "API routes", "Configuration"], answer: 0 },
            { q: "What is Fast Refresh?", options: ["Instant feedback on edits without losing state", "A page reload", "A caching strategy", "A deployment tool"], answer: 0 },
            { q: "How do you use environment variables?", options: ["process.env.VARIABLE", "env.VARIABLE", "config.VARIABLE", "var.VARIABLE"], answer: 0 },
            { q: "Which prefix exposes env vars to the browser?", options: ["NEXT_PUBLIC_", "PUBLIC_", "BROWSER_", "REACT_APP_"], answer: 0 },

            // --- Intermediate (20) ---
            { q: "What is Static Site Generation (SSG)?", options: ["Pre-rendering pages at build time", "Rendering on request", "Rendering on the client", "Rendering in the database"], answer: 0 },
            { q: "What is Server-Side Rendering (SSR)?", options: ["Rendering pages on each request", "Rendering at build time", "Rendering on the client", "Rendering in a worker"], answer: 0 },
            { q: "What is Incremental Static Regeneration (ISR)?", options: ["Updating static pages after build time", "Rebuilding the whole site", "Client-side rendering", "Database caching"], answer: 0 },
            { q: "How do you implement ISR?", options: ["Add 'revalidate' to fetch options or segment config", "Use useEffect", "Use a cron job", "Manual rebuild"], answer: 0 },
            { q: "What is a Route Handler?", options: ["An API endpoint defined in route.js", "A page handler", "A middleware", "A database query"], answer: 0 },
            { q: "How do you read cookies in a Server Component?", options: ["cookies() from 'next/headers'", "document.cookie", "useCookies", "req.cookies"], answer: 0 },
            { q: "How do you read headers in a Server Component?", options: ["headers() from 'next/headers'", "req.headers", "useHeaders", "window.headers"], answer: 0 },
            { q: "What is Middleware in Next.js?", options: ["Code that runs before a request is completed", "A database driver", "A frontend component", "A testing tool"], answer: 0 },
            { q: "Where is middleware.js defined?", options: ["In the root of the project", "In the app folder", "In the pages folder", "In the public folder"], answer: 0 },
            { q: "What is the purpose of 'generateStaticParams'?", options: ["To define dynamic routes to be statically generated", "To generate parameters", "To fetch data", "To configure the router"], answer: 0 },
            { q: "How do you redirect a user?", options: ["redirect() from 'next/navigation'", "window.location", "Router.push", "Link component"], answer: 0 },
            { q: "What is the 'usePathname' hook?", options: ["To get the current URL path", "To get the file path", "To navigate", "To get query params"], answer: 0 },
            { q: "What is the 'useSearchParams' hook?", options: ["To get query string parameters", "To search files", "To search the database", "To filter lists"], answer: 0 },
            { q: "What is the 'useRouter' hook?", options: ["To programmatically navigate", "To define routes", "To get route params", "To handle errors"], answer: 0 },
            { q: "What is the difference between 'router.push' and 'router.replace'?", options: ["Push adds a history entry, replace replaces the current one", "Push is faster", "Replace is faster", "No difference"], answer: 0 },
            { q: "How do you optimize fonts?", options: ["next/font", "Import CSS", "CDN links", "Download files"], answer: 0 },
            { q: "What is the purpose of 'next.config.js'?", options: ["Custom configuration for Next.js", "Database config", "Route config", "Style config"], answer: 0 },
            { q: "How do you handle images from external domains?", options: ["Configure 'images.remotePatterns' in next.config.js", "Just use the URL", "Download them", "Use a proxy"], answer: 0 },
            { q: "What is a Server Action?", options: ["A function that runs on the server, callable from Client Components", "A Redux action", "A database trigger", "A cron job"], answer: 0 },
            { q: "How do you define a Server Action?", options: ["'use server' inside the function or file", "'use action'", "'server-side'", "It's automatic"], answer: 0 },

            // --- Senior (20) ---
            { q: "What is React Server Components (RSC) payload?", options: ["A JSON-like representation of the rendered server components", "HTML", "JavaScript bundle", "CSS"], answer: 0 },
            { q: "How does hydration work with Server Components?", options: ["Server Components are not hydrated, only Client Components are", "Everything is hydrated", "Nothing is hydrated", "Only HTML is hydrated"], answer: 0 },
            { q: "What is Streaming?", options: ["Sending UI in chunks as it becomes ready", "Watching videos", "Downloading files", "Database replication"], answer: 0 },
            { q: "How do you implement Streaming?", options: ["Using Suspense boundaries", "Using WebSockets", "Using fetch", "Using lazy loading"], answer: 0 },
            { q: "What is the Edge Runtime?", options: ["A lightweight runtime based on Web APIs, for edge locations", "Node.js", "Browser runtime", "Python runtime"], answer: 0 },
            { q: "When would you use the Edge Runtime?", options: ["For low-latency middleware or simple APIs", "For heavy computation", "For database access", "For file processing"], answer: 0 },
            { q: "What is Parallel Routing?", options: ["Rendering multiple pages in the same layout simultaneously (Slots)", "Running routes in parallel", "Load balancing", "A/B testing"], answer: 0 },
            { q: "What is Intercepting Routes?", options: ["Loading a route within the current layout (e.g., modal)", "Blocking routes", "Middleware", "Security feature"], answer: 0 },
            { q: "How do you optimize bundle size?", options: ["Dynamic imports, analyzing bundles", "Minification", "Tree shaking", "All of the above"], answer: 3 },
            { q: "What is the purpose of 'cache' function from React?", options: ["To memoize data requests per request", "To cache files", "To cache assets", "To cache routes"], answer: 0 },
            { q: "What is the difference between 'revalidatePath' and 'revalidateTag'?", options: ["Path revalidates a specific URL, Tag revalidates all data with that tag", "They are the same", "Tag is faster", "Path is deprecated"], answer: 0 },
            { q: "How do you handle internationalization (i18n)?", options: ["Routing middleware and dictionaries", "Google Translate", "Separate domains", "Manual translation"], answer: 0 },
            { q: "What is Open Graph (OG) Image Generation?", options: ["Dynamically creating social media images using code (ImageResponse)", "Uploading images", "Photoshop", "CSS styling"], answer: 0 },
            { q: "How do you secure Server Actions?", options: ["Authentication and authorization checks inside the action", "Middleware", "Firewall", "HTTPS"], answer: 0 },
            { q: "What is the 'taint' API?", options: ["Preventing sensitive data from being passed to the client", "Coloring data", "Validating data", "Logging data"], answer: 0 },
            { q: "How do you handle large page transitions?", options: ["useTransition hook", "Loading spinners", "Optimistic UI", "All of the above"], answer: 3 },
            { q: "What is Optimistic UI?", options: ["Updating the UI immediately before the server responds", "Hoping for the best", "Fast UI", "Colorful UI"], answer: 0 },
            { q: "How do you implement Optimistic UI in Next.js?", options: ["useOptimistic hook", "useState", "useEffect", "Redux"], answer: 0 },
            { q: "What is Partial Prerendering (PPR)?", options: ["Combining static and dynamic rendering in the same route", "Rendering half the page", "Lazy loading", "Caching"], answer: 0 },
            { q: "How do you debug Next.js performance?", options: ["Web Vitals, React DevTools, Lighthouse", "Console logs", "Guessing", "User reports"], answer: 0 }
        ];

        // Shuffle questions
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const quizContainer = document.getElementById('quiz');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress');
        
        let shuffledQuestions = shuffle([...questions]);
        let score = 0;
        let answeredCount = 0;

        function renderQuiz() {
            quizContainer.innerHTML = '';
            shuffledQuestions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                qEl.innerHTML = `
                    <h3>${index + 1}. ${q.q}</h3>
                    <div class="options" id="opt-${index}">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="checkAnswer(${index}, ${i}, ${q.answer})">${opt}</div>
                        `).join('')}
                    </div>
                `;
                quizContainer.appendChild(qEl);
            });
            updateScore();
        }

        window.checkAnswer = function(qIndex, selected, correct) {
            const optionsDiv = document.getElementById(`opt-${qIndex}`);
            if (optionsDiv.classList.contains('answered')) return;

            optionsDiv.classList.add('answered');
            const options = optionsDiv.getElementsByClassName('option');
            
            if (selected === correct) {
                options[selected].classList.add('correct');
                score++;
            } else {
                options[selected].classList.add('incorrect');
                options[correct].classList.add('correct');
            }

            // Dim others
            for (let i = 0; i < options.length; i++) {
                if (i !== selected && i !== correct) {
                    options[i].classList.add('dimmed');
                }
            }

            answeredCount++;
            updateScore();
        };

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            const percent = (answeredCount / questions.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        renderQuiz();
    </script>
</body>
</html>
