<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next.js Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/nextjs_styles.css">
    <script src="../assets/js/nextjs_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>Next.js Final Assessment</h1>
        <p>Test your knowledge from Beginner to Senior Next.js Developer.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Beginner (20) ---
            { q: "What is Next.js?", options: ["A React framework for production", "A database", "A CSS library", "A testing tool"], answer: 0 },
            { q: "Which folder is used for routing in the App Router?", options: ["app", "pages", "routes", "src"], answer: 0 },
            { q: "What is the file name for the main page of a route?", options: ["page.js", "index.js", "main.js", "route.js"], answer: 0 },
            { q: "How do you create a dynamic route?", options: ["[slug]", "{slug}", ":slug", "(slug)"], answer: 0 },
            { q: "What is the purpose of layout.js?", options: ["To define a shared UI for a segment and its children", "To define styles", "To configure the database", "To handle errors"], answer: 0 },
            { q: "What is the Link component used for?", options: ["Client-side navigation", "External links", "Styling", "Server requests"], answer: 0 },
            { q: "How do you add global CSS?", options: ["Import it in the root layout", "Import it in every file", "Use inline styles", "Use a script tag"], answer: 0 },
            { q: "What is the Image component used for?", options: ["Optimized image rendering", "Displaying SVGs", "Canvas drawing", "Uploading images"], answer: 0 },
            { q: "What is the default rendering method in Next.js App Router?", options: ["Server Components", "Client Components", "Static Generation", "SSR"], answer: 0 },
            { q: "How do you mark a component as a Client Component?", options: ["'use client'", "'use server'", "'client-side'", "It's automatic"], answer: 0 },
            { q: "What is the purpose of loading.js?", options: ["To show a loading UI while content loads", "To load scripts", "To optimize images", "To fetch data"], answer: 0 },
            { q: "What is the purpose of error.js?", options: ["To handle runtime errors in a route segment", "To log errors", "To show 404 pages", "To validate forms"], answer: 0 },
            { q: "What is the purpose of not-found.js?", options: ["To show a custom 404 page", "To handle 500 errors", "To redirect users", "To find files"], answer: 0 },
            { q: "How do you fetch data in a Server Component?", options: ["Async/await with fetch()", "useEffect", "useSWR", "getStaticProps"], answer: 0 },
            { q: "What is Metadata?", options: ["SEO information like title and description", "Database schema", "User data", "File size"], answer: 0 },
            { q: "How do you define metadata in a page?", options: ["Export a metadata object or generateMetadata function", "Use the Head component", "Use a meta tag", "Config file"], answer: 0 },
            { q: "What is the 'public' folder for?", options: ["Static assets like images and fonts", "Public code", "API routes", "Configuration"], answer: 0 },
            { q: "What is Fast Refresh?", options: ["Instant feedback on edits without losing state", "A page reload", "A caching strategy", "A deployment tool"], answer: 0 },
            { q: "How do you use environment variables?", options: ["process.env.VARIABLE", "env.VARIABLE", "config.VARIABLE", "var.VARIABLE"], answer: 0 },
            { q: "Which prefix exposes env vars to the browser?", options: ["NEXT_PUBLIC_", "PUBLIC_", "BROWSER_", "REACT_APP_"], answer: 0 },

            // --- Intermediate (20) ---
            { q: "What is Static Site Generation (SSG)?", options: ["Pre-rendering pages at build time", "Rendering on request", "Rendering on the client", "Rendering in the database"], answer: 0 },
            { q: "What is Server-Side Rendering (SSR)?", options: ["Rendering pages on each request", "Rendering at build time", "Rendering on the client", "Rendering in a worker"], answer: 0 },
            { q: "What is Incremental Static Regeneration (ISR)?", options: ["Updating static pages after build time", "Rebuilding the whole site", "Client-side rendering", "Database caching"], answer: 0 },
            { q: "How do you implement ISR?", options: ["Add 'revalidate' to fetch options or segment config", "Use useEffect", "Use a cron job", "Manual rebuild"], answer: 0 },
            { q: "What is a Route Handler?", options: ["An API endpoint defined in route.js", "A page handler", "A middleware", "A database query"], answer: 0 },
            { q: "How do you read cookies in a Server Component?", options: ["cookies() from 'next/headers'", "document.cookie", "useCookies", "req.cookies"], answer: 0 },
            { q: "How do you read headers in a Server Component?", options: ["headers() from 'next/headers'", "req.headers", "useHeaders", "window.headers"], answer: 0 },
            { q: "What is Middleware in Next.js?", options: ["Code that runs before a request is completed", "A database driver", "A frontend component", "A testing tool"], answer: 0 },
            { q: "Where is middleware.js defined?", options: ["In the root of the project", "In the app folder", "In the pages folder", "In the public folder"], answer: 0 },
            { q: "What is the purpose of 'generateStaticParams'?", options: ["To define dynamic routes to be statically generated", "To generate parameters", "To fetch data", "To configure the router"], answer: 0 },
            { q: "How do you redirect a user?", options: ["redirect() from 'next/navigation'", "window.location", "Router.push", "Link component"], answer: 0 },
            { q: "What is the 'usePathname' hook?", options: ["Returns the current pathname", "Returns the full URL", "Returns the query params", "Returns the domain"], answer: 0 },
            { q: "What is the 'useSearchParams' hook?", options: ["Returns the current search parameters", "Returns the path", "Returns the hash", "Returns the body"], answer: 0 },
            { q: "What is the 'useRouter' hook?", options: ["Allows programmatic navigation", "Returns the router object", "Returns the route", "Returns the map"], answer: 0 },
            { q: "What is the difference between 'next/link' and 'a' tag?", options: ["Link enables client-side navigation (SPA feel), 'a' tag causes full reload", "Link is slower", "Link is deprecated", "They are the same"], answer: 0 },
            { q: "What is 'next/image'?", options: ["An extension of the HTML <img> element for automatic image optimization", "A drawing tool", "A gallery", "A plugin"], answer: 0 },
            { q: "What is the 'priority' prop in Image?", options: ["Prioritizes loading of the image (e.g., LCP element)", "Low priority", "Hidden", "Lazy load"], answer: 0 },
            { q: "What is 'next/script'?", options: ["An extension of the HTML <script> element for optimizing third-party scripts", "A coding tool", "A font", "A style"], answer: 0 },
            { q: "What is the 'strategy' prop in Script?", options: ["Controls when the script should load (e.g., lazyOnload, afterInteractive)", "A game strategy", "A plan", "A map"], answer: 0 },

            // --- Advanced (20) ---
            { q: "What is React Server Components (RSC)?", options: ["Components that render on the server and send HTML/JSON to client", "Components on client", "API routes", "Database"], answer: 0 },
            { q: "What is the benefit of RSC?", options: ["Reduced bundle size, direct database access, improved performance", "More JS", "Slower", "Harder to write"], answer: 0 },
            { q: "Can you use hooks in Server Components?", options: ["No", "Yes", "Only useState", "Only useEffect"], answer: 0 },
            { q: "Can you import a Server Component into a Client Component?", options: ["No, you must pass it as children or prop", "Yes", "Maybe", "Sometimes"], answer: 0 },
            { q: "Can you import a Client Component into a Server Component?", options: ["Yes", "No", "Maybe", "Sometimes"], answer: 0 },
            { q: "What is Streaming?", options: ["Sending UI in chunks as it is rendered", "Watching movies", "Water flow", "Data loss"], answer: 0 },
            { q: "What is Suspense used for in Next.js?", options: ["Showing a fallback while content loads (streaming)", "Stopping execution", "Error handling", "Routing"], answer: 0 },
            { q: "What is Partial Prerendering (PPR)?", options: ["Combining static and dynamic rendering in the same route", "Rendering partially", "Rendering slowly", "Rendering fast"], answer: 0 },
            { q: "What is Server Actions?", options: ["Async functions that run on the server, callable from Client Components", "Client functions", "API routes", "Database queries"], answer: 0 },
            { q: "How do you define a Server Action?", options: ["'use server' at top of file or function", "'use client'", "'server-side'", "'action'"], answer: 0 },
            { q: "What is the benefit of Server Actions?", options: ["Simplified data mutation without creating API endpoints", "More code", "Slower", "Less secure"], answer: 0 },
            { q: "What is 'revalidatePath'?", options: ["Purges cached data for a specific path", "Reloads page", "Deletes path", "Creates path"], answer: 0 },
            { q: "What is 'revalidateTag'?", options: ["Purges cached data associated with a specific tag", "Reloads tag", "Deletes tag", "Creates tag"], answer: 0 },
            { q: "What is the Next.js Cache?", options: ["A multi-layer caching system (Data, Full Route, Router, Request)", "Browser cache", "CDN", "Memory"], answer: 0 },
            { q: "What is the Data Cache?", options: ["Persists results of fetch requests across requests", "Browser cache", "Cookie", "Session"], answer: 0 },
            { q: "What is the Full Route Cache?", options: ["Stores the rendered HTML and RSC payload of a route", "Browser cache", "CDN", "Memory"], answer: 0 },
            { q: "What is the Router Cache?", options: ["In-memory client-side cache of visited routes", "Server cache", "Database", "File"], answer: 0 },
            { q: "What is the Request Memoization?", options: ["Deduplicates identical fetch requests within a single render pass", "Caching requests", "Memory loss", "Forgetting"], answer: 0 },
            { q: "How do you opt out of caching?", options: ["fetch(url, { cache: 'no-store' }) or export const dynamic = 'force-dynamic'", "cache: false", "no-cache", "stop-cache"], answer: 0 },
            { q: "What is 'generateStaticParams' used for?", options: ["Statically generating routes at build time with dynamic segments", "Generating params", "Fetching data", "Routing"], answer: 0 },

            // --- Deployment & Config (20) ---
            { q: "What is Vercel?", options: ["The platform created by the makers of Next.js for optimal deployment", "A database", "A language", "A tool"], answer: 0 },
            { q: "What is 'next build'?", options: ["Builds the application for production", "Runs dev server", "Tests app", "Lints code"], answer: 0 },
            { q: "What is 'next start'?", options: ["Starts the production server", "Starts dev server", "Builds app", "Tests app"], answer: 0 },
            { q: "What is 'next.config.js'?", options: ["Configuration file for Next.js", "Main file", "Route file", "Style file"], answer: 0 },
            { q: "How do you configure redirects?", options: ["In next.config.js redirects() function", "In page.js", "In layout.js", "In middleware"], answer: 0 },
            { q: "How do you configure rewrites?", options: ["In next.config.js rewrites() function", "In page.js", "In layout.js", "In middleware"], answer: 0 },
            { q: "What is the difference between redirect and rewrite?", options: ["Redirect changes URL, Rewrite keeps URL but shows different content", "They are the same", "Rewrite changes URL", "Redirect keeps URL"], answer: 0 },
            { q: "What is 'output: export'?", options: ["Configures Next.js for static HTML export", "Exports data", "Exports code", "Exports images"], answer: 0 },
            { q: "What is the Edge Runtime?", options: ["A lightweight runtime based on Web Standards (V8) for Edge Middleware/Functions", "Node.js", "Python", "Java"], answer: 0 },
            { q: "What are the limitations of Edge Runtime?", options: ["No Node.js APIs (fs, path, etc.)", "No fetch", "No standard APIs", "No limitations"], answer: 0 },
            { q: "What is Internationalization (i18n)?", options: ["Support for multiple languages", "Internet", "Integration", "Interface"], answer: 0 },
            { q: "How do you implement i18n in App Router?", options: ["Using middleware and dynamic route segments ([lang])", "next.config.js i18n", "Plugin", "Library"], answer: 0 },
            { q: "What is Turbopack?", options: ["An incremental bundler optimized for JavaScript and TypeScript (successor to Webpack)", "A turbo", "A pack", "A tool"], answer: 0 },
            { q: "What is 'instrumentation.js'?", options: ["File to integrate monitoring/observability tools", "Music", "Instruments", "Tools"], answer: 0 },
            { q: "What is OpenGraph?", options: ["Protocol for social media metadata", "A graph", "A chart", "A map"], answer: 0 },
            { q: "What is 'sitemap.xml'?", options: ["A file listing all pages for search engines", "A map", "A site", "A list"], answer: 0 },
            { q: "What is 'robots.txt'?", options: ["Instructions for crawlers", "A robot", "A text", "A file"], answer: 0 },
            { q: "What is 'manifest.json'?", options: ["Web App Manifest for PWA", "A list", "A file", "A config"], answer: 0 },
            { q: "What is a PWA?", options: ["Progressive Web App", "Public Web App", "Private Web App", "Personal Web App"], answer: 0 },
            { q: "What is AMP?", options: ["Accelerated Mobile Pages (deprecated in Next.js)", "Amplifier", "A map", "A page"], answer: 0 },

            // --- Ecosystem & Migration (20) ---
            { q: "What is the Pages Router?", options: ["The original routing system in Next.js (pages directory)", "The new one", "The best one", "The only one"], answer: 0 },
            { q: "What is 'getStaticProps'?", options: ["Data fetching for SSG in Pages Router", "App Router function", "Client function", "Server function"], answer: 0 },
            { q: "What is 'getServerSideProps'?", options: ["Data fetching for SSR in Pages Router", "App Router function", "Client function", "Server function"], answer: 0 },
            { q: "What is 'getInitialProps'?", options: ["Legacy data fetching method", "New method", "Best method", "Only method"], answer: 0 },
            { q: "What is the '_app.js' file?", options: ["Custom App component in Pages Router", "Root layout", "Main file", "Config"], answer: 0 },
            { q: "What is the '_document.js' file?", options: ["Custom Document component in Pages Router", "Root layout", "Main file", "Config"], answer: 0 },
            { q: "How do you migrate from Pages to App Router?", options: ["Incrementally move routes from pages/ to app/", "Rewrite everything", "Use a tool", "You can't"], answer: 0 },
            { q: "What is 'clsx' or 'classnames'?", options: ["Utility for constructing className strings conditionally", "A class", "A name", "A style"], answer: 0 },
            { q: "What is 'sharp'?", options: ["High performance Node.js image processing module (used by next/image)", "A knife", "A tool", "A library"], answer: 0 },
            { q: "What is 'eslint-config-next'?", options: ["ESLint configuration for Next.js", "A linter", "A config", "A tool"], answer: 0 },
            { q: "What is TypeScript?", options: ["A typed superset of JavaScript", "A script", "A type", "A language"], answer: 0 },
            { q: "Why use TypeScript with Next.js?", options: ["Type safety and better developer experience", "It is required", "It is faster", "It is easier"], answer: 0 },
            { q: "What is 'next/font'?", options: ["Optimizes fonts (Google Fonts and local)", "A font", "A style", "A tool"], answer: 0 },
            { q: "What is 'next/og'?", options: ["Dynamic Open Graph Image Generation", "Original Gangster", "A game", "A tool"], answer: 0 },
            { q: "What is 'next/mdx'?", options: ["Support for MDX (Markdown + JSX)", "Medical", "A file", "A tool"], answer: 0 },
            { q: "What is 't3-stack'?", options: ["A popular stack (Next.js, tRPC, Tailwind, TypeScript, Prisma)", "A stack", "A tool", "A library"], answer: 0 },
            { q: "What is Prisma?", options: ["Next-generation ORM", "A prism", "A database", "A tool"], answer: 0 },
            { q: "What is tRPC?", options: ["End-to-end typesafe APIs", "A protocol", "A tool", "A library"], answer: 0 },
            { q: "What is Auth.js (NextAuth)?", options: ["Authentication solution for Next.js", "Authorization", "A tool", "A library"], answer: 0 },
            { q: "What is Stripe?", options: ["Payment processing platform", "A line", "A pattern", "A tool"], answer: 0 }
        ];

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            const quizContainer = document.getElementById('quiz');
            const scoreDisplay = document.getElementById('score-display');
            const progressBar = document.getElementById('progress');
            let score = 0;
            let answeredCount = 0;

            // Shuffle questions
            shuffleArray(questions);

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                
                const title = document.createElement('h3');
                title.textContent = `${index + 1}. ${q.q}`;
                qEl.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                let optionsWithIndices = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                shuffleArray(optionsWithIndices);

                optionsWithIndices.forEach(optObj => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.textContent = optObj.text;
                    
                    btn.onclick = () => {
                        if (optionsDiv.classList.contains('answered')) return;
                        
                        optionsDiv.classList.add('answered');
                        answeredCount++;
                        
                        const progressPercent = (answeredCount / questions.length) * 100;
                        progressBar.style.width = `${progressPercent}%`;

                        if (optObj.originalIndex === q.answer) {
                            score++;
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('incorrect');
                        }

                        Array.from(optionsDiv.children).forEach(child => {
                            if (child.textContent === q.options[q.answer]) {
                                child.classList.add('correct');
                            } else if (child !== btn) {
                                child.classList.add('dimmed');
                            }
                        });

                        scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
                    };
                    
                    optionsDiv.appendChild(btn);
                });

                qEl.appendChild(optionsDiv);
                quizContainer.appendChild(qEl);
            });
            
            scoreDisplay.textContent = `Score: 0 / ${questions.length}`;
        }

        initQuiz();
    </script>
</body>
</html>
