<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/devops_styles.css">
    <script src="../assets/js/devops_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>DevOps Final Assessment</h1>
        <p>Test your knowledge from Docker Basics to Kubernetes Orchestration.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Docker (20) ---
            { q: "What is Docker?", options: ["A platform for developing, shipping, and running applications in containers", "A virtual machine", "A coding language", "A database"], answer: 0 },
            { q: "What is a Container?", options: ["A lightweight, standalone, executable package of software", "A heavy virtual machine", "A storage box", "A network protocol"], answer: 0 },
            { q: "What is a Dockerfile?", options: ["A text document that contains all the commands to assemble an image", "A binary file", "A log file", "A configuration for Kubernetes"], answer: 0 },
            { q: "What is a Docker Image?", options: ["A read-only template with instructions for creating a Docker container", "A picture", "A running container", "A database backup"], answer: 0 },
            { q: "Which command builds an image from a Dockerfile?", options: ["docker build", "docker create", "docker run", "docker image"], answer: 0 },
            { q: "Which command runs a container?", options: ["docker run", "docker start", "docker execute", "docker play"], answer: 0 },
            { q: "What is Docker Compose?", options: ["A tool for defining and running multi-container Docker applications", "A music composer", "A single container tool", "A cloud provider"], answer: 0 },
            { q: "What is the default file name for Docker Compose?", options: ["docker-compose.yml", "dockerfile", "compose.json", "config.yaml"], answer: 0 },
            { q: "How do you list running containers?", options: ["docker ps", "docker list", "docker show", "docker run -l"], answer: 0 },
            { q: "How do you stop a container?", options: ["docker stop <id>", "docker kill <id>", "docker end <id>", "docker halt <id>"], answer: 0 },
            { q: "What is a Volume in Docker?", options: ["A mechanism for persisting data generated by and used by Docker containers", "A sound level", "A network interface", "A CPU limit"], answer: 0 },
            { q: "What is a Network in Docker?", options: ["A communication channel between containers", "A social network", "A cable", "A router"], answer: 0 },
            { q: "What is the Docker Hub?", options: ["A cloud-based registry service", "A local folder", "A network switch", "A meeting place"], answer: 0 },
            { q: "How do you pull an image from Docker Hub?", options: ["docker pull", "docker get", "docker fetch", "docker download"], answer: 0 },
            { q: "What is the difference between CMD and ENTRYPOINT?", options: ["CMD sets default arguments, ENTRYPOINT configures the container as an executable", "They are the same", "CMD is faster", "ENTRYPOINT is deprecated"], answer: 0 },
            { q: "What is a multi-stage build?", options: ["A method to reduce image size by using multiple FROM instructions", "Building multiple images", "Building slowly", "Building in stages"], answer: 0 },
            { q: "How do you remove all unused containers, networks, images?", options: ["docker system prune", "docker clean", "docker rm all", "docker delete"], answer: 0 },
            { q: "What is the .dockerignore file?", options: ["Specifies files to ignore during the build context", "Ignores errors", "Ignores logs", "Ignores users"], answer: 0 },
            { q: "How do you view container logs?", options: ["docker logs <id>", "docker show logs", "docker print", "docker history"], answer: 0 },
            { q: "What is 'docker exec' used for?", options: ["Running a command in a running container", "Starting a container", "Building an image", "Stopping a container"], answer: 0 },

            // --- Kubernetes Basics (20) ---
            { q: "What is Kubernetes (K8s)?", options: ["An open-source system for automating deployment, scaling, and management of containerized applications", "A container engine", "A cloud provider", "A database"], answer: 0 },
            { q: "What is a Pod?", options: ["The smallest deployable unit in Kubernetes", "A container", "A node", "A cluster"], answer: 0 },
            { q: "What is a Node?", options: ["A worker machine in Kubernetes (VM or physical)", "A pod", "A master", "A service"], answer: 0 },
            { q: "What is a Cluster?", options: ["A set of nodes that run containerized applications", "A single computer", "A database", "A network"], answer: 0 },
            { q: "What is kubectl?", options: ["The command line tool for Kubernetes", "A dashboard", "A server", "A container"], answer: 0 },
            { q: "What is a Deployment?", options: ["A resource that provides declarative updates for Pods and ReplicaSets", "A script", "A container", "A service"], answer: 0 },
            { q: "What is a Service?", options: ["An abstraction which defines a logical set of Pods and a policy by which to access them", "A server", "A deployment", "A node"], answer: 0 },
            { q: "What is a Namespace?", options: ["A way to divide cluster resources between multiple users", "A name", "A folder", "A network"], answer: 0 },
            { q: "What is a ReplicaSet?", options: ["Ensures a specified number of pod replicas are running", "A backup", "A copy", "A database"], answer: 0 },
            { q: "What is Minikube?", options: ["A tool that runs a single-node Kubernetes cluster locally", "A small cube", "A game", "A cloud service"], answer: 0 },
            { q: "How do you apply a configuration file?", options: ["kubectl apply -f <file>", "kubectl run <file>", "kubectl start <file>", "kubectl create <file>"], answer: 0 },
            { q: "What is a ConfigMap?", options: ["An API object used to store non-confidential data in key-value pairs", "A map", "A secret", "A database"], answer: 0 },
            { q: "What is a Secret?", options: ["An object that contains a small amount of sensitive data such as a password, a token, or a key", "A hidden file", "A config map", "A pod"], answer: 0 },
            { q: "What is Ingress?", options: ["An API object that manages external access to the services in a cluster, typically HTTP", "A door", "A service", "A pod"], answer: 0 },
            { q: "What is a PersistentVolume (PV)?", options: ["A piece of storage in the cluster that has been provisioned by an administrator", "A disk", "A folder", "A file"], answer: 0 },
            { q: "What is a PersistentVolumeClaim (PVC)?", options: ["A request for storage by a user", "A claim", "A volume", "A disk"], answer: 0 },
            { q: "What is Helm?", options: ["The package manager for Kubernetes", "A ship part", "A container", "A cloud"], answer: 0 },
            { q: "What is a Chart in Helm?", options: ["A collection of files that describe a related set of Kubernetes resources", "A map", "A graph", "A list"], answer: 0 },
            { q: "What is a DaemonSet?", options: ["Ensures that all (or some) Nodes run a copy of a Pod", "A demon", "A service", "A deployment"], answer: 0 },
            { q: "What is a StatefulSet?", options: ["Manages the deployment and scaling of a set of Pods, and provides guarantees about the ordering and uniqueness of these Pods", "A state", "A set", "A deployment"], answer: 0 },

            // --- CI/CD (20) ---
            { q: "What does CI stand for?", options: ["Continuous Integration", "Continuous Improvement", "Code Integration", "Cloud Integration"], answer: 0 },
            { q: "What does CD stand for?", options: ["Continuous Delivery / Continuous Deployment", "Code Delivery", "Cloud Deployment", "Continuous Development"], answer: 0 },
            { q: "What is Jenkins?", options: ["An open source automation server", "A butler", "A database", "A cloud"], answer: 0 },
            { q: "What is a Pipeline?", options: ["A set of automated processes that allow developers to compile, build, and deploy their code", "A tube", "A script", "A server"], answer: 0 },
            { q: "What is GitHub Actions?", options: ["A CI/CD platform that allows you to automate your build, test, and deployment pipeline", "A git command", "A repository", "A user"], answer: 0 },
            { q: "What is GitLab CI?", options: ["A tool built into GitLab for software development through the continuous methodologies", "A lab", "A git command", "A server"], answer: 0 },
            { q: "What is a Build Artifact?", options: ["A file produced by a build process (e.g., JAR, WAR, EXE)", "A relic", "A log", "A code"], answer: 0 },
            { q: "What is Blue-Green Deployment?", options: ["A technique that reduces downtime and risk by running two identical production environments", "A color scheme", "A deployment error", "A testing method"], answer: 0 },
            { q: "What is Canary Deployment?", options: ["Rolling out changes to a small subset of users before rolling it out to the entire infrastructure", "A bird", "A mine", "A test"], answer: 0 },
            { q: "What is Infrastructure as Code (IaC)?", options: ["Managing and provisioning computer data centers through machine-readable definition files", "Coding infrastructure", "Building servers", "Writing scripts"], answer: 0 },
            { q: "What is Terraform?", options: ["An open-source infrastructure as code software tool", "A planet", "A game", "A cloud"], answer: 0 },
            { q: "What is Ansible?", options: ["An open-source software provisioning, configuration management, and application-deployment tool", "A book", "A script", "A server"], answer: 0 },
            { q: "What is a Playbook in Ansible?", options: ["A YAML file containing a list of tasks to be executed", "A game plan", "A script", "A book"], answer: 0 },
            { q: "What is a Module in Terraform?", options: ["A container for multiple resources that are used together", "A part", "A file", "A folder"], answer: 0 },
            { q: "What is 'terraform init'?", options: ["Initializes a working directory containing Terraform configuration files", "Starts terraform", "Creates a file", "Deletes a file"], answer: 0 },
            { q: "What is 'terraform plan'?", options: ["Creates an execution plan", "Plans a trip", "Runs terraform", "Stops terraform"], answer: 0 },
            { q: "What is 'terraform apply'?", options: ["Applies the changes required to reach the desired state of the configuration", "Applies for a job", "Runs a plan", "Stops a plan"], answer: 0 },
            { q: "What is Idempotency?", options: ["The property that an operation can be applied multiple times without changing the result beyond the initial application", "A math term", "A coding style", "A server state"], answer: 0 },
            { q: "What is GitOps?", options: ["A set of practices to manage infrastructure and application configurations using Git", "Git operations", "GitHub", "GitLab"], answer: 0 },
            { q: "What is ArgoCD?", options: ["A declarative, GitOps continuous delivery tool for Kubernetes", "A ship", "A cd", "A tool"], answer: 0 },

            // --- Cloud & Monitoring (20) ---
            { q: "What is AWS?", options: ["Amazon Web Services", "Amazon Web Server", "Amazon Web Site", "Amazon Web System"], answer: 0 },
            { q: "What is EC2?", options: ["Elastic Compute Cloud (Virtual Servers)", "Elastic Cloud 2", "Easy Compute 2", "Extra Compute 2"], answer: 0 },
            { q: "What is S3?", options: ["Simple Storage Service (Object Storage)", "Simple Server 3", "Super Storage 3", "System Storage 3"], answer: 0 },
            { q: "What is VPC?", options: ["Virtual Private Cloud", "Virtual Public Cloud", "Very Private Cloud", "Virtual PC"], answer: 0 },
            { q: "What is IAM?", options: ["Identity and Access Management", "I Am Me", "Identity Access Manager", "Internal Access Management"], answer: 0 },
            { q: "What is Prometheus?", options: ["An open-source monitoring and alerting toolkit", "A god", "A movie", "A server"], answer: 0 },
            { q: "What is Grafana?", options: ["An open-source analytics and interactive visualization web application", "A graph", "A database", "A tool"], answer: 0 },
            { q: "What is ELK Stack?", options: ["Elasticsearch, Logstash, Kibana", "Elk animal", "A stack of wood", "A server"], answer: 0 },
            { q: "What is Splunk?", options: ["A software platform to search, analyze and visualize the machine-generated data", "A sound", "A game", "A tool"], answer: 0 },
            { q: "What is Nagios?", options: ["A free and open source computer-software application that monitors systems, networks and infrastructure", "A snake", "A tool", "A server"], answer: 0 },
            { q: "What is a Load Balancer?", options: ["Distributes network or application traffic across a number of servers", "Balances weight", "A scale", "A server"], answer: 0 },
            { q: "What is Auto Scaling?", options: ["Automatically adjusts the number of computing resources based on load", "Scaling a fish", "Scaling a wall", "Scaling a map"], answer: 0 },
            { q: "What is High Availability (HA)?", options: ["Systems that are durable and likely to operate continuously without failure for a long time", "High uptime", "High speed", "High cost"], answer: 0 },
            { q: "What is Disaster Recovery (DR)?", options: ["A set of policies, tools and procedures to enable the recovery or continuation of vital technology infrastructure and systems following a natural or human-induced disaster", "Recovering from a cold", "Fixing a computer", "Restoring a file"], answer: 0 },
            { q: "What is Serverless?", options: ["A cloud computing execution model in which the cloud provider runs the server, and dynamically manages the allocation of machine resources", "No servers", "Less servers", "More servers"], answer: 0 },
            { q: "What is AWS Lambda?", options: ["A serverless compute service", "A greek letter", "A game", "A tool"], answer: 0 },
            { q: "What is Azure?", options: ["Microsoft's cloud computing service", "A color", "A sky", "A tool"], answer: 0 },
            { q: "What is GCP?", options: ["Google Cloud Platform", "Google Computer Program", "Global Cloud Platform", "General Cloud Platform"], answer: 0 },
            { q: "What is a Region in Cloud?", options: ["A physical location around the world where we cluster data centers", "A map area", "A city", "A country"], answer: 0 },
            { q: "What is an Availability Zone (AZ)?", options: ["One or more discrete data centers with redundant power, networking, and connectivity in an AWS Region", "A zone", "A time zone", "A safe zone"], answer: 0 },

            // --- Linux & Scripting (20) ---
            { q: "What is Linux?", options: ["An open-source Unix-like operating system kernel", "A window", "A door", "A penguin"], answer: 0 },
            { q: "What is Bash?", options: ["Bourne Again SHell", "A party", "A hit", "A command"], answer: 0 },
            { q: "How do you list files in Linux?", options: ["ls", "list", "dir", "show"], answer: 0 },
            { q: "How do you change directory?", options: ["cd", "change", "move", "go"], answer: 0 },
            { q: "How do you create a directory?", options: ["mkdir", "create", "new", "folder"], answer: 0 },
            { q: "How do you remove a file?", options: ["rm", "remove", "delete", "del"], answer: 0 },
            { q: "How do you view file content?", options: ["cat", "dog", "view", "show"], answer: 0 },
            { q: "What is 'grep'?", options: ["A command-line utility for searching plain-text data sets for lines that match a regular expression", "A fruit", "A grip", "A tool"], answer: 0 },
            { q: "What is 'chmod'?", options: ["Changes the file mode bits (permissions)", "Changes mode", "Changes mod", "Changes model"], answer: 0 },
            { q: "What is 'chown'?", options: ["Changes file owner and group", "Changes own", "Changes town", "Changes down"], answer: 0 },
            { q: "What is 'sudo'?", options: ["Execute a command as another user, typically the superuser", "Super user do", "So do", "Sudoku"], answer: 0 },
            { q: "What is 'ssh'?", options: ["Secure Shell, a cryptographic network protocol for operating network services securely over an unsecured network", "Shh", "Shell", "Secure"], answer: 0 },
            { q: "What is a Cron Job?", options: ["A time-based job scheduler in Unix-like computer operating systems", "A job", "A clock", "A calendar"], answer: 0 },
            { q: "What is a Process?", options: ["An instance of a computer program that is being executed", "A step", "A procedure", "A task"], answer: 0 },
            { q: "How do you check disk usage?", options: ["df -h", "du", "disk", "usage"], answer: 0 },
            { q: "How do you check memory usage?", options: ["free -h", "mem", "memory", "ram"], answer: 0 },
            { q: "What is 'top'?", options: ["Displays processor activity and tasks managed by kernel in real-time", "Top of the list", "A hat", "A command"], answer: 0 },
            { q: "What is a Shell Script?", options: ["A computer program designed to be run by the Unix shell", "A script", "A play", "A movie"], answer: 0 },
            { q: "What is '#!' (Shebang)?", options: ["An interpreter directive as the first line of a script", "A bang", "A hash", "A comment"], answer: 0 },
            { q: "What is 'sed'?", options: ["Stream Editor for filtering and transforming text", "Said", "Sad", "Seed"], answer: 0 }
        ];

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            const quizContainer = document.getElementById('quiz');
            const scoreDisplay = document.getElementById('score-display');
            const progressBar = document.getElementById('progress');
            let score = 0;
            let answeredCount = 0;

            // Shuffle questions
            shuffleArray(questions);

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                
                const title = document.createElement('h3');
                title.textContent = `${index + 1}. ${q.q}`;
                qEl.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                let optionsWithIndices = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                shuffleArray(optionsWithIndices);

                optionsWithIndices.forEach(optObj => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.textContent = optObj.text;
                    
                    btn.onclick = () => {
                        if (optionsDiv.classList.contains('answered')) return;
                        
                        optionsDiv.classList.add('answered');
                        answeredCount++;
                        
                        const progressPercent = (answeredCount / questions.length) * 100;
                        progressBar.style.width = `${progressPercent}%`;

                        if (optObj.originalIndex === q.answer) {
                            score++;
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('incorrect');
                        }

                        Array.from(optionsDiv.children).forEach(child => {
                            if (child.textContent === q.options[q.answer]) {
                                child.classList.add('correct');
                            } else if (child !== btn) {
                                child.classList.add('dimmed');
                            }
                        });

                        scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
                    };
                    
                    optionsDiv.appendChild(btn);
                });

                qEl.appendChild(optionsDiv);
                quizContainer.appendChild(qEl);
            });
            
            scoreDisplay.textContent = `Score: 0 / ${questions.length}`;
        }

        initQuiz();
    </script>
</body>
</html>
