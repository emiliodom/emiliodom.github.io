<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/devops_styles.css">
    <script src="../assets/js/devops_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>DevOps Final Assessment</h1>
        <p>Test your knowledge from Docker Basics to Kubernetes Orchestration.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Docker (20) ---
            { q: "What is Docker?", options: ["A platform for developing, shipping, and running applications in containers", "A virtual machine", "A coding language", "A database"], answer: 0 },
            { q: "What is a Container?", options: ["A lightweight, standalone, executable package of software", "A heavy virtual machine", "A storage box", "A network protocol"], answer: 0 },
            { q: "What is a Dockerfile?", options: ["A text document that contains all the commands to assemble an image", "A binary file", "A log file", "A configuration for Kubernetes"], answer: 0 },
            { q: "What is a Docker Image?", options: ["A read-only template with instructions for creating a Docker container", "A picture", "A running container", "A database backup"], answer: 0 },
            { q: "Which command builds an image from a Dockerfile?", options: ["docker build", "docker create", "docker run", "docker image"], answer: 0 },
            { q: "Which command runs a container?", options: ["docker run", "docker start", "docker execute", "docker play"], answer: 0 },
            { q: "What is Docker Compose?", options: ["A tool for defining and running multi-container Docker applications", "A music composer", "A single container tool", "A cloud provider"], answer: 0 },
            { q: "What is the default file name for Docker Compose?", options: ["docker-compose.yml", "dockerfile", "compose.json", "config.yaml"], answer: 0 },
            { q: "How do you list running containers?", options: ["docker ps", "docker list", "docker show", "docker run -l"], answer: 0 },
            { q: "How do you stop a container?", options: ["docker stop <id>", "docker kill <id>", "docker end <id>", "docker halt <id>"], answer: 0 },
            { q: "What is a Volume in Docker?", options: ["A mechanism for persisting data generated by and used by Docker containers", "A sound level", "A network interface", "A CPU limit"], answer: 0 },
            { q: "What is a Network in Docker?", options: ["A communication channel between containers", "A social network", "A cable", "A router"], answer: 0 },
            { q: "What is the Docker Hub?", options: ["A cloud-based registry service", "A local folder", "A network switch", "A meeting place"], answer: 0 },
            { q: "How do you pull an image from Docker Hub?", options: ["docker pull", "docker get", "docker fetch", "docker download"], answer: 0 },
            { q: "What is the difference between CMD and ENTRYPOINT?", options: ["CMD sets default arguments, ENTRYPOINT configures the container as an executable", "They are the same", "CMD is faster", "ENTRYPOINT is deprecated"], answer: 0 },
            { q: "What is a multi-stage build?", options: ["A method to reduce image size by using multiple FROM instructions", "Building multiple images", "Building slowly", "Building in stages"], answer: 0 },
            { q: "How do you remove all unused containers, networks, images?", options: ["docker system prune", "docker clean", "docker rm all", "docker delete"], answer: 0 },
            { q: "What is the .dockerignore file?", options: ["Specifies files to ignore during the build context", "Ignores errors", "Ignores logs", "Ignores users"], answer: 0 },
            { q: "How do you view container logs?", options: ["docker logs <id>", "docker show logs", "docker print", "docker history"], answer: 0 },
            { q: "What is 'docker exec' used for?", options: ["Running a command in a running container", "Starting a container", "Building an image", "Stopping a container"], answer: 0 },

            // --- Kubernetes Basics (20) ---
            { q: "What is Kubernetes (K8s)?", options: ["An open-source system for automating deployment, scaling, and management of containerized applications", "A container engine", "A cloud provider", "A database"], answer: 0 },
            { q: "What is a Pod?", options: ["The smallest deployable unit in Kubernetes", "A container", "A node", "A cluster"], answer: 0 },
            { q: "What is a Node?", options: ["A worker machine in Kubernetes (VM or physical)", "A pod", "A master", "A service"], answer: 0 },
            { q: "What is a Cluster?", options: ["A set of nodes that run containerized applications", "A single computer", "A database", "A network"], answer: 0 },
            { q: "What is kubectl?", options: ["The command line tool for Kubernetes", "A dashboard", "A server", "A container"], answer: 0 },
            { q: "What is a Deployment?", options: ["A resource that provides declarative updates for Pods and ReplicaSets", "A script", "A container", "A service"], answer: 0 },
            { q: "What is a Service?", options: ["An abstraction which defines a logical set of Pods and a policy by which to access them", "A server", "A deployment", "A node"], answer: 0 },
            { q: "What is a Namespace?", options: ["A way to divide cluster resources between multiple users", "A name", "A folder", "A network"], answer: 0 },
            { q: "What is a ReplicaSet?", options: ["Ensures a specified number of pod replicas are running", "A backup", "A copy", "A database"], answer: 0 },
            { q: "What is Minikube?", options: ["A tool that runs a single-node Kubernetes cluster locally", "A small cube", "A game", "A cloud service"], answer: 0 },
            { q: "How do you apply a configuration file?", options: ["kubectl apply -f <file>", "kubectl run <file>", "kubectl start <file>", "kubectl create <file>"], answer: 0 },
            { q: "How do you get pods?", options: ["kubectl get pods", "kubectl list pods", "kubectl show pods", "kubectl pods"], answer: 0 },
            { q: "What is a ConfigMap?", options: ["An API object used to store non-confidential data in key-value pairs", "A map", "A configuration file", "A secret"], answer: 0 },
            { q: "What is a Secret?", options: ["An object that contains a small amount of sensitive data such as a password, a token, or a key", "A hidden file", "A config map", "A pod"], answer: 0 },
            { q: "What is Ingress?", options: ["An API object that manages external access to the services in a cluster, typically HTTP", "A door", "A firewall", "A load balancer"], answer: 0 },
            { q: "What is a StatefulSet?", options: ["Manages the deployment and scaling of a set of Pods, and provides guarantees about the ordering and uniqueness of these Pods", "A deployment", "A service", "A pod"], answer: 0 },
            { q: "What is a DaemonSet?", options: ["Ensures that all (or some) Nodes run a copy of a Pod", "A demon", "A service", "A deployment"], answer: 0 },
            { q: "What is a Job in K8s?", options: ["Creates one or more Pods and ensures that a specified number of them successfully terminate", "A task", "A service", "A deployment"], answer: 0 },
            { q: "What is a CronJob?", options: ["Runs Jobs on a time-based schedule", "A clock", "A calendar", "A service"], answer: 0 },
            { q: "What is Helm?", options: ["A package manager for Kubernetes", "A ship part", "A tool", "A container"], answer: 0 },

            // --- Advanced K8s & CI/CD (20) ---
            { q: "What is a Sidecar container?", options: ["A helper container that runs alongside the main container in a pod", "A car", "A separate pod", "A service"], answer: 0 },
            { q: "What is a Liveness Probe?", options: ["Indicates whether the container is running", "Checks if the container is alive", "A medical tool", "A network test"], answer: 0 },
            { q: "What is a Readiness Probe?", options: ["Indicates whether the container is ready to service requests", "Checks if the container is ready", "A test", "A signal"], answer: 0 },
            { q: "What is HPA (Horizontal Pod Autoscaler)?", options: ["Automatically scales the number of pods based on observed CPU utilization", "Scales nodes", "Scales memory", "Scales disk"], answer: 0 },
            { q: "What is a PersistentVolume (PV)?", options: ["A piece of storage in the cluster that has been provisioned by an administrator", "A disk", "A folder", "A file"], answer: 0 },
            { q: "What is a PersistentVolumeClaim (PVC)?", options: ["A request for storage by a user", "A claim", "A volume", "A disk"], answer: 0 },
            { q: "What is RBAC?", options: ["Role-Based Access Control", "Remote Backup", "Robot Control", "Rule Based Access"], answer: 0 },
            { q: "What is a ServiceAccount?", options: ["Provides an identity for processes that run in a Pod", "A user account", "A bank account", "A service"], answer: 0 },
            { q: "What is a NetworkPolicy?", options: ["Specification of how groups of Pods are allowed to communicate with each other and other network endpoints", "A firewall rule", "A network cable", "A router config"], answer: 0 },
            { q: "What is GitOps?", options: ["A set of practices to manage infrastructure and application configurations using Git", "Git operations", "GitHub", "GitLab"], answer: 0 },
            { q: "What is ArgoCD?", options: ["A declarative, GitOps continuous delivery tool for Kubernetes", "A ship", "A CI tool", "A database"], answer: 0 },
            { q: "What is CI/CD?", options: ["Continuous Integration and Continuous Delivery/Deployment", "Code Integration", "Cloud Integration", "Computer Integration"], answer: 0 },
            { q: "What is a Pipeline?", options: ["A set of automated processes that allow developers to compile, build, and deploy their code", "A tube", "A network", "A script"], answer: 0 },
            { q: "What is Blue/Green Deployment?", options: ["A technique that reduces downtime and risk by running two identical production environments", "Colors", "A deployment style", "A testing method"], answer: 0 },
            { q: "What is Canary Deployment?", options: ["Rolling out changes to a small subset of users before rolling it out to the entire infrastructure", "A bird", "A mine", "A test"], answer: 0 },
            { q: "What is Infrastructure as Code (IaC)?", options: ["Managing and provisioning computer data centers through machine-readable definition files", "Coding infrastructure", "Servers", "Cloud"], answer: 0 },
            { q: "What is Terraform?", options: ["An open-source IaC software tool", "A planet", "A game", "A database"], answer: 0 },
            { q: "What is Prometheus?", options: ["An open-source monitoring and alerting toolkit", "A god", "A movie", "A tool"], answer: 0 },
            { q: "What is Grafana?", options: ["An open-source analytics and interactive visualization web application", "A graph", "A tool", "A database"], answer: 0 },
            { q: "What is Istio?", options: ["An open platform to connect, manage, and secure microservices (Service Mesh)", "A mesh", "A tool", "A network"], answer: 0 },

            // --- Terraform & IaC (10) ---
            { q: "What is the main file extension for Terraform?", options: [".tf", ".tform", ".terra", ".hcl"], answer: 0 },
            { q: "What command initializes a Terraform working directory?", options: ["terraform init", "terraform start", "terraform begin", "terraform create"], answer: 0 },
            { q: "What command creates an execution plan?", options: ["terraform plan", "terraform dry-run", "terraform check", "terraform preview"], answer: 0 },
            { q: "What command applies the changes required to reach the desired state?", options: ["terraform apply", "terraform run", "terraform execute", "terraform go"], answer: 0 },
            { q: "What is the Terraform State?", options: ["A file that maps real world resources to your configuration", "A database", "A log file", "A backup"], answer: 0 },
            { q: "What is a Terraform Provider?", options: ["A plugin that enables interaction with an API (e.g., AWS, Azure)", "A server", "A user", "A module"], answer: 0 },
            { q: "What is a Terraform Module?", options: ["A container for multiple resources that are used together", "A function", "A class", "A variable"], answer: 0 },
            { q: "How do you destroy all resources managed by Terraform?", options: ["terraform destroy", "terraform delete", "terraform remove", "terraform kill"], answer: 0 },
            { q: "What is HCL?", options: ["HashiCorp Configuration Language", "Hyper Text Language", "High Code Language", "Hardware Control Language"], answer: 0 },
            { q: "Where is the local state file stored by default?", options: ["terraform.tfstate", "state.json", "terraform.db", ".terraform"], answer: 0 },

            // --- Ansible & Config Mgmt (10) ---
            { q: "What is Ansible?", options: ["An open-source automation tool for configuration management and application deployment", "A monitoring tool", "A container engine", "A database"], answer: 0 },
            { q: "What is an Ansible Playbook?", options: ["A YAML file containing a series of plays to define automation tasks", "A script", "A binary", "A config file"], answer: 0 },
            { q: "What is the default inventory file location?", options: ["/etc/ansible/hosts", "/var/ansible/hosts", "/home/ansible/hosts", "/usr/ansible/hosts"], answer: 0 },
            { q: "What is an Ansible Module?", options: ["A standalone script that Ansible runs on your behalf", "A plugin", "A library", "A kernel"], answer: 0 },
            { q: "What does 'Idempotency' mean in Ansible?", options: ["Running the same operation multiple times produces the same result", "Running once", "Running fast", "Running safely"], answer: 0 },
            { q: "How do you run a playbook?", options: ["ansible-playbook <filename>", "ansible run <filename>", "ansible execute <filename>", "ansible start <filename>"], answer: 0 },
            { q: "What is an Ansible Role?", options: ["A way to group multiple tasks, variables, files, and handlers", "A user role", "A permission", "A server"], answer: 0 },
            { q: "What is Ansible Galaxy?", options: ["A repository for Ansible Roles", "A space game", "A cloud provider", "A network"], answer: 0 },
            { q: "Does Ansible require an agent on the managed node?", options: ["No, it is agentless", "Yes", "Sometimes", "Only for Windows"], answer: 0 },
            { q: "What protocol does Ansible use to communicate with Linux nodes?", options: ["SSH", "FTP", "HTTP", "Telnet"], answer: 0 },

            // --- Linux & Networking (10) ---
            { q: "What is the kernel?", options: ["The core component of an OS that manages system resources", "A shell", "A user", "A file"], answer: 0 },
            { q: "Which command lists files in a directory?", options: ["ls", "list", "dir", "show"], answer: 0 },
            { q: "Which command shows the current working directory?", options: ["pwd", "cwd", "whereami", "path"], answer: 0 },
            { q: "What is chmod used for?", options: ["Changing file permissions", "Changing file owner", "Changing file name", "Changing file content"], answer: 0 },
            { q: "What is chown used for?", options: ["Changing file owner", "Changing file permissions", "Changing file group", "Changing file size"], answer: 0 },
            { q: "What is grep used for?", options: ["Searching text using patterns", "Copying files", "Moving files", "Deleting files"], answer: 0 },
            { q: "What is the OSI model?", options: ["A conceptual framework used to describe the functions of a networking system", "A computer model", "A software", "A protocol"], answer: 0 },
            { q: "What is TCP?", options: ["Transmission Control Protocol (reliable, connection-oriented)", "Transfer Control Protocol", "Time Control Protocol", "Text Control Protocol"], answer: 0 },
            { q: "What is UDP?", options: ["User Datagram Protocol (unreliable, connectionless)", "User Data Protocol", "Universal Data Protocol", "Uniform Data Protocol"], answer: 0 },
            { q: "What is DNS?", options: ["Domain Name System (translates domain names to IP addresses)", "Data Name System", "Domain Network System", "Digital Name System"], answer: 0 },

            // --- Monitoring & Security (10) ---
            { q: "What is an SLI?", options: ["Service Level Indicator (a quantitative measure of some aspect of the level of service)", "Service Level Item", "Service Level Index", "Service Level Info"], answer: 0 },
            { q: "What is an SLO?", options: ["Service Level Objective (a target value or range of values for a service level)", "Service Level Option", "Service Level Order", "Service Level Output"], answer: 0 },
            { q: "What is an SLA?", options: ["Service Level Agreement (a contract between a service provider and a customer)", "Service Level Access", "Service Level Action", "Service Level Account"], answer: 0 },
            { q: "What is the Principle of Least Privilege?", options: ["Giving a user or process only those privileges which are essential to perform its intended function", "Giving all privileges", "Giving no privileges", "Giving random privileges"], answer: 0 },
            { q: "What is SSH?", options: ["Secure Shell (a cryptographic network protocol for operating network services securely)", "Secure Socket", "Secure System", "Secure Service"], answer: 0 },
            { q: "What is a Firewall?", options: ["A network security device that monitors and filters incoming and outgoing network traffic", "A wall of fire", "A virus", "A bug"], answer: 0 },
            { q: "What is Encryption?", options: ["The process of converting information or data into a code, especially to prevent unauthorized access", "Deleting data", "Copying data", "Moving data"], answer: 0 },
            { q: "What is 2FA?", options: ["Two-Factor Authentication", "Two-Factor Authorization", "Two-Factor Access", "Two-Factor Account"], answer: 0 },
            { q: "What is a DDoS attack?", options: ["Distributed Denial of Service", "Direct Denial of Service", "Data Denial of Service", "Digital Denial of Service"], answer: 0 },
            { q: "What is Vault (by HashiCorp)?", options: ["A tool for secrets management, encryption as a service, and privileged access management", "A safe", "A storage", "A database"], answer: 0 }
        ];

        // Shuffle questions
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const quizContainer = document.getElementById('quiz');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress');
        
        let shuffledQuestions = shuffle([...questions]);
        let score = 0;
        let answeredCount = 0;

        function renderQuiz() {
            quizContainer.innerHTML = '';
            shuffledQuestions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                qEl.innerHTML = `
                    <h3>${index + 1}. ${q.q}</h3>
                    <div class="options" id="opt-${index}">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="checkAnswer(${index}, ${i}, ${q.answer})">${opt}</div>
                        `).join('')}
                    </div>
                `;
                quizContainer.appendChild(qEl);
            });
            updateScore();
        }

        window.checkAnswer = function(qIndex, selected, correct) {
            const optionsDiv = document.getElementById(`opt-${qIndex}`);
            if (optionsDiv.classList.contains('answered')) return;

            optionsDiv.classList.add('answered');
            const options = optionsDiv.getElementsByClassName('option');
            
            if (selected === correct) {
                options[selected].classList.add('correct');
                score++;
            } else {
                options[selected].classList.add('incorrect');
                options[correct].classList.add('correct');
            }

            // Dim others
            for (let i = 0; i < options.length; i++) {
                if (i !== selected && i !== correct) {
                    options[i].classList.add('dimmed');
                }
            }

            answeredCount++;
            updateScore();
        };

        function updateScore() {
            scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            const percent = (answeredCount / questions.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        renderQuiz();
    </script>
</body>
</html>
