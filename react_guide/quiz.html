<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/react_styles.css">
    <script src="../assets/js/react_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>React Final Assessment</h1>
        <p>Test your knowledge from Beginner to Senior React Developer.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Beginner (20) ---

            { q: "How do you pass data from a parent to a child component?", options: ["State", "Props", "Context", "Redux"], answer: 1 },
            { q: "What is the correct syntax to render a list of items?", options: ["items.forEach()", "items.map()", "for loop", "items.filter()"], answer: 1 },
            { q: "What is the purpose of the 'key' prop in lists?", options: ["To style the element", "To uniquely identify elements for efficient updates", "To access the DOM node", "To pass data to the child"], answer: 1 },
            { q: "Which hook is used to perform side effects?", options: ["useState", "useMemo", "useEffect", "useCallback"], answer: 2 },
            { q: "What is JSX?", options: ["JavaScript XML", "Java Syntax Extension", "JSON XML", "JavaScript XSLT"], answer: 0 },
            { q: "How do you handle events in React?", options: ["onclick='handler()'", "onClick={handler}", "ng-click='handler'", "v-on:click='handler'"], answer: 1 },
            { q: "What is a controlled component?", options: ["A component controlled by Redux", "A component where form data is handled by React state", "A component with no state", "A component that controls others"], answer: 1 },
            { q: "What is the default return value of useEffect?", options: ["The state", "A cleanup function or undefined", "The component", "A promise"], answer: 1 },
            { q: "Can you use hooks in class components?", options: ["Yes", "No", "Only useState", "Only useEffect"], answer: 1 },
            { q: "What is the purpose of React.Fragment?", options: ["To create a new DOM node", "To group children without adding extra nodes to the DOM", "To split code", "To memoize components"], answer: 1 },
            { q: "How do you conditionally render an element?", options: ["if-else inside JSX", "Ternary operator or logical &&", "switch-case inside JSX", "v-if"], answer: 1 },
            { q: "What is prop drilling?", options: ["Passing props through multiple levels of components", "Validating props", "Modifying props", "Deleting props"], answer: 0 },
            { q: "Which hook is used to access the Context API?", options: ["useContext", "useProvider", "useGlobal", "useState"], answer: 0 },
            { q: "What is the second argument of useEffect used for?", options: ["Cleanup", "Dependency array", "Initial state", "Callback"], answer: 1 },
            { q: "How do you create a ref in a functional component?", options: ["React.createRef()", "useRef()", "this.refs", "ref()"], answer: 1 },
            { q: "What does 'lifting state up' mean?", options: ["Moving state to Redux", "Moving state to a common ancestor", "Deleting state", "Using context"], answer: 1 },
            { q: "What is the purpose of React.StrictMode?", options: ["To enforce types", "To highlight potential problems in an application", "To optimize performance", "To prevent errors"], answer: 1 },
            { q: "How do you import React in a file?", options: ["import React from 'react'", "require('react')", "include React", "import { React } from 'react'"], answer: 0 },

            // --- Intermediate (20) ---
            { q: "What is the difference between useMemo and useCallback?", options: ["useMemo memoizes a value, useCallback memoizes a function", "They are the same", "useMemo is for side effects", "useCallback is for state"], answer: 0 },
            { q: "What is the Context API used for?", options: ["State management for global data", "Routing", "API calls", "Styling"], answer: 0 },
            { q: "What is a Higher-Order Component (HOC)?", options: ["A component that returns another component", "A component with high priority", "A parent component", "A Redux store"], answer: 0 },
            { q: "What is the purpose of useReducer?", options: ["To handle complex state logic", "To reduce array size", "To replace Redux", "To optimize rendering"], answer: 0 },
            { q: "How do you optimize performance for a functional component?", options: ["React.memo", "shouldComponentUpdate", "PureComponent", "useMemo"], answer: 0 },
            { q: "What is the 'children' prop?", options: ["The first child element", "All nested elements/components", "The parent component", "A specific data prop"], answer: 1 },
            { q: "How do you handle errors in React components?", options: ["try-catch blocks", "Error Boundaries", "onError prop", "useError hook"], answer: 1 },
            { q: "What is lazy loading in React?", options: ["Loading components only when needed", "Loading data slowly", "Delaying state updates", "Lazy evaluation of props"], answer: 0 },
            { q: "Which library is commonly used for routing in React?", options: ["React Router", "Vue Router", "Angular Router", "Express"], answer: 0 },
            { q: "What is the purpose of custom hooks?", options: ["To reuse stateful logic", "To create new UI components", "To override React hooks", "To fetch data"], answer: 0 },
            { q: "How do you prevent a component from re-rendering?", options: ["React.memo", "usePreventRender", "stopRender()", "It's impossible"], answer: 0 },
            { q: "What is the 'key' prop used for?", options: ["Helping React identify which items have changed", "Styling", "Accessing DOM", "Passing data"], answer: 0 },
            { q: "What is a Portal?", options: ["Rendering children into a DOM node outside the parent hierarchy", "A game", "A routing tool", "A state manager"], answer: 0 },
            { q: "What is Reconciliation?", options: ["The process of updating the DOM to match the Virtual DOM", "Fixing bugs", "Merging branches", "Compiling code"], answer: 0 },
            { q: "What is the difference between Element and Component?", options: ["Element is an object describing UI, Component is a function/class returning Elements", "They are the same", "Component is smaller", "Element is a function"], answer: 0 },
            { q: "What is 'dangerouslySetInnerHTML'?", options: ["React's replacement for innerHTML", "A virus", "A warning", "A style"], answer: 0 },
            { q: "What is SyntheticEvent?", options: ["Cross-browser wrapper around the browser's native event", "A fake event", "A custom event", "A global event"], answer: 0 },
            { q: "What is the purpose of 'defaultProps'?", options: ["Defining default values for props", "Defining types", "Defining state", "Defining styles"], answer: 0 },
            { q: "What is 'propTypes'?", options: ["Runtime type checking for props", "Compile time checking", "A library", "A function"], answer: 0 },

            // --- Advanced (20) ---
            { q: "What is Concurrent Mode?", options: ["A set of features that help React apps stay responsive", "Running multiple apps", "Parallel processing", "A strict mode"], answer: 0 },
            { q: "What is Suspense?", options: ["A component that lets you wait for some code to load", "A thriller", "A loading spinner", "A state"], answer: 0 },
            { q: "What is useLayoutEffect?", options: ["Fires synchronously after all DOM mutations", "Fires asynchronously", "Fires before render", "Fires after paint"], answer: 0 },
            { q: "What is the difference between useEffect and useLayoutEffect?", options: ["useEffect is async, useLayoutEffect is sync", "They are the same", "useEffect is sync", "useLayoutEffect is async"], answer: 0 },
            { q: "What is a Fiber?", options: ["The new reconciliation engine in React 16", "A thread", "A material", "A cable"], answer: 0 },
            { q: "What is Hydration?", options: ["Attaching event listeners to server-rendered HTML", "Drinking water", "Loading data", "Compiling code"], answer: 0 },
            { q: "What is Server Components?", options: ["Components that render exclusively on the server", "Components on the client", "API routes", "Database models"], answer: 0 },
            { q: "What is Code Splitting?", options: ["Splitting code into smaller bundles to load on demand", "Deleting code", "Formatting code", "Minifying code"], answer: 0 },
            { q: "How do you implement Code Splitting?", options: ["React.lazy and Suspense", "Split() function", "Webpack only", "You can't"], answer: 0 },
            { q: "What is an Error Boundary?", options: ["A component that catches JavaScript errors in its child component tree", "A try-catch block", "A linter", "A debugger"], answer: 0 },
            { q: "Which lifecycle method is used in Error Boundaries?", options: ["componentDidCatch", "render", "componentDidMount", "shouldComponentUpdate"], answer: 0 },
            { q: "What is 'forwardRef'?", options: ["Passing a ref through a component to one of its children", "Moving forward", "Referencing a parent", "A hook"], answer: 0 },
            { q: "What is 'useImperativeHandle'?", options: ["Customizing the instance value that is exposed to parent components when using ref", "Handling errors", "Handling events", "Handling state"], answer: 0 },
            { q: "What is 'useDebugValue'?", options: ["Displaying a label for custom hooks in React DevTools", "Debugging code", "Logging values", "Testing"], answer: 0 },
            { q: "What is the Flux architecture?", options: ["Unidirectional data flow pattern", "MVC pattern", "MVVM pattern", "Two-way binding"], answer: 0 },
            { q: "What is Redux?", options: ["A predictable state container for JS apps", "A database", "A router", "A server"], answer: 0 },
            { q: "What is a Reducer in Redux?", options: ["A pure function that takes previous state and an action, and returns the next state", "A component", "A store", "A middleware"], answer: 0 },
            { q: "What is an Action in Redux?", options: ["A plain JavaScript object describing what happened", "A function", "A component", "A state"], answer: 0 },
            { q: "What is the Store in Redux?", options: ["Holds the application state", "A shop", "A database", "A file"], answer: 0 },
            { q: "What is Redux Thunk?", options: ["Middleware for writing action creators that return a function", "A database", "A component", "A hook"], answer: 0 },

            // --- Ecosystem & Performance (20) ---
            { q: "What is React Router?", options: ["Standard routing library for React", "A map", "A server", "A database"], answer: 0 },
            { q: "What is the difference between BrowserRouter and HashRouter?", options: ["BrowserRouter uses HTML5 history API, HashRouter uses hash portion of URL", "They are the same", "HashRouter is newer", "BrowserRouter is deprecated"], answer: 0 },
            { q: "What is Styled Components?", options: ["CSS-in-JS library", "A component library", "A framework", "A tool"], answer: 0 },
            { q: "What is Tailwind CSS?", options: ["A utility-first CSS framework", "A component library", "A preprocessor", "A JS library"], answer: 0 },
            { q: "What is Next.js?", options: ["A React framework for production (SSR, SSG)", "A database", "A testing tool", "A mobile framework"], answer: 0 },
            { q: "What is Gatsby?", options: ["A static site generator based on React", "A book", "A server", "A database"], answer: 0 },
            { q: "What is React Native?", options: ["A framework for building native apps using React", "A web framework", "A database", "A tool"], answer: 0 },
            { q: "What is Jest?", options: ["A JavaScript testing framework", "A joke", "A component", "A library"], answer: 0 },
            { q: "What is React Testing Library?", options: ["A library for testing React components", "A book", "A tool", "A server"], answer: 0 },
            { q: "What is Enzyme?", options: ["A JavaScript testing utility for React (older)", "A protein", "A tool", "A library"], answer: 0 },
            { q: "What is Prettier?", options: ["An opinionated code formatter", "A linter", "A compiler", "A bundler"], answer: 0 },
            { q: "What is ESLint?", options: ["A tool for identifying and reporting on patterns found in ECMAScript/JavaScript code", "A formatter", "A compiler", "A bundler"], answer: 0 },
            { q: "What is Webpack?", options: ["A static module bundler", "A server", "A database", "A browser"], answer: 0 },
            { q: "What is Babel?", options: ["A JavaScript compiler (transpiler)", "A tower", "A library", "A framework"], answer: 0 },
            { q: "What is Vite?", options: ["A build tool that aims to provide a faster and leaner development experience", "A framework", "A library", "A server"], answer: 0 },
            { q: "What is Create React App (CRA)?", options: ["An officially supported way to create single-page React applications", "A tool", "A library", "A framework"], answer: 0 },
            { q: "Why is CRA being replaced by Vite/Next.js?", options: ["Performance and modern features", "It is broken", "It is paid", "It is old"], answer: 0 },
            { q: "What is React Query (TanStack Query)?", options: ["A data-fetching library for React", "A database", "A router", "A state manager"], answer: 0 },
            { q: "What is Zustand?", options: ["A small, fast and scalable bearbones state-management solution", "A country", "A food", "A tool"], answer: 0 },
            { q: "What is Recoil?", options: ["A state management library for React (atomic)", "A spring", "A tool", "A library"], answer: 0 },

            // --- Patterns & Best Practices (20) ---
            { q: "What is the Container/Presentational pattern?", options: ["Separating logic (container) from UI (presentational)", "A box", "A style", "A hook"], answer: 0 },
            { q: "What is Composition vs Inheritance?", options: ["React prefers composition (combining components) over inheritance", "Inheritance is better", "They are the same", "Composition is slower"], answer: 0 },
            { q: "What is a Render Prop?", options: ["A technique for sharing code between components using a prop whose value is a function", "A prop", "A state", "A hook"], answer: 0 },
            { q: "What is Memoization?", options: ["An optimization technique used primarily to speed up computer programs by storing the results of expensive function calls", "Memory loss", "Writing notes", "Deleting data"], answer: 0 },
            { q: "When should you use useMemo?", options: ["To memoize expensive calculations", "Always", "Never", "For simple math"], answer: 0 },
            { q: "When should you use useCallback?", options: ["To memoize functions passed as props to optimized child components", "Always", "Never", "For every function"], answer: 0 },
            { q: "What is the Rule of Hooks?", options: ["Only call hooks at the top level, and only from React functions", "Call anywhere", "Call in loops", "Call in conditions"], answer: 0 },
            { q: "Why keys should be stable?", options: ["To maintain component state and focus", "To look good", "To be random", "To be unique only"], answer: 0 },
            { q: "Why not use array index as key?", options: ["It can cause issues with component state if the list order changes", "It is illegal", "It is slow", "It is ugly"], answer: 0 },
            { q: "What is Immutable Data?", options: ["Data that cannot be changed once created", "Data that changes", "Fast data", "Slow data"], answer: 0 },
            { q: "Why is immutability important in React?", options: ["It helps with performance optimization and change detection", "It is required", "It is faster", "It is easier"], answer: 0 },
            { q: "What is a Pure Component?", options: ["A component that renders the same output for the same props and state", "A clean component", "A simple component", "A fast component"], answer: 0 },
            { q: "How do you optimize a large list?", options: ["Virtualization (Windowing)", "Pagination", "Infinite Scroll", "All of the above"], answer: 3 },
            { q: "What is React.lazy?", options: ["Lets you define a component that is loaded dynamically", "Lazy loading images", "Lazy developer", "Lazy state"], answer: 0 },
            { q: "What is the purpose of 'displayName'?", options: ["Used in debugging messages", "Displaying name on screen", "Variable name", "File name"], answer: 0 },
            { q: "What is 'strict mode'?", options: ["A tool for highlighting potential problems in an application", "A hard mode", "A game", "A setting"], answer: 0 },
            { q: "How do you share logic between components?", options: ["Custom Hooks", "HOCs", "Render Props", "All of the above"], answer: 3 },
            { q: "What is the difference between state and props?", options: ["State is internal and mutable, props are external and immutable", "State is external", "Props are mutable", "No difference"], answer: 0 },
            { q: "What is unidirectional data flow?", options: ["Data flows down from parent to child", "Data flows up", "Data flows both ways", "Data flows sideways"], answer: 0 },
            { q: "What is the Virtual DOM diffing algorithm?", options: ["Heuristic algorithm to update the DOM efficiently", "Sorting algorithm", "Search algorithm", "Encryption"], answer: 0 }
        ];

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            const quizContainer = document.getElementById('quiz');
            const scoreDisplay = document.getElementById('score-display');
            const progressBar = document.getElementById('progress');
            let score = 0;
            let answeredCount = 0;

            // Shuffle questions
            shuffleArray(questions);

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                
                const title = document.createElement('h3');
                title.textContent = `${index + 1}. ${q.q}`;
                qEl.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                let optionsWithIndices = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                shuffleArray(optionsWithIndices);

                optionsWithIndices.forEach(optObj => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.textContent = optObj.text;
                    
                    btn.onclick = () => {
                        if (optionsDiv.classList.contains('answered')) return;
                        
                        optionsDiv.classList.add('answered');
                        answeredCount++;
                        
                        const progressPercent = (answeredCount / questions.length) * 100;
                        progressBar.style.width = `${progressPercent}%`;

                        if (optObj.originalIndex === q.answer) {
                            score++;
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('incorrect');
                        }

                        Array.from(optionsDiv.children).forEach(child => {
                            if (child.textContent === q.options[q.answer]) {
                                child.classList.add('correct');
                            } else if (child !== btn) {
                                child.classList.add('dimmed');
                            }
                        });

                        scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
                    };
                    
                    optionsDiv.appendChild(btn);
                });

                qEl.appendChild(optionsDiv);
                quizContainer.appendChild(qEl);
            });
            
            scoreDisplay.textContent = `Score: 0 / ${questions.length}`;
        }

        initQuiz();
    </script>
</body>
</html>
