<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/moodle_styles.css">
    <script src="../assets/js/moodle_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word; /* Fix for long text */
            white-space: normal;    /* Ensure wrapping */
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        
        /* Interaction states */
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }

        /* Scoreboard */
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>Final Assessment</h1>
        <p>Test your knowledge of Moodle Architecture and Development.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

        const quizContainer = document.getElementById('quiz');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress');

        let score = 0;
        let answeredCount = 0;

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderQuiz() {
            quizContainer.innerHTML = questions.map((q, index) => `
                <div class="question" id="q-${index}" data-index="${index}">
                    <h3>${index + 1}. ${escapeHtml(q.q)}</h3>
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="handleSelection(${index}, ${i})">${escapeHtml(opt)}</div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            updateScoreBoard();
        }

        window.handleSelection = (qIndex, oIndex) => {
            const questionEl = document.getElementById(`q-${qIndex}`);
            const optionsDiv = questionEl.querySelector('.options');
            
            // Prevent re-answering
            if (optionsDiv.classList.contains('answered')) return;

            optionsDiv.classList.add('answered');
            const options = optionsDiv.querySelectorAll('.option');
            const correctAnswer = questions[qIndex].answer;

            // Visual feedback
            if (oIndex === correctAnswer) {
                options[oIndex].classList.add('correct');
                score++;
            } else {
                options[oIndex].classList.add('incorrect');
                options[correctAnswer].classList.add('correct');
            }

            // Dim other options
            options.forEach((opt, i) => {
                if (i !== oIndex && i !== correctAnswer) {
                    opt.classList.add('dimmed');
                }
            });

            answeredCount++;
            updateScoreBoard();
        };

        function updateScoreBoard() {
            scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
            const percentage = (answeredCount / questions.length) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        initLayout();
        shuffleArray(questions);
        renderQuiz();
    </script>
