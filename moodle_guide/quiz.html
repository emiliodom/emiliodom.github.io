<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Final Quiz</title>
    <link rel="stylesheet" href="../assets/css/moodle_styles.css">
    <script src="../assets/js/moodle_layout.js"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        .question { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .question h3 { margin-top: 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 12px; 
            border: 1px solid var(--card-border); 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s; 
            word-break: break-word; /* Fix for long text */
            white-space: normal;    /* Ensure wrapping */
            line-height: 1.4;
        }
        .option:hover { background: var(--nav-bg); }
        
        /* Interaction states */
        .options.answered .option { cursor: default; pointer-events: none; }
        .option.correct { background: #10b981; color: white; border-color: #059669; }
        .option.incorrect { background: #ef4444; color: white; border-color: #b91c1c; }
        .option.dimmed { opacity: 0.6; }

        /* Scoreboard */
        #score-panel {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #score-display { font-weight: bold; font-size: 1.2em; }
        .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; width: 200px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--link-color); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <header>
        <h1>Final Assessment</h1>
        <p>Test your knowledge of Moodle Architecture and Development.</p>
    </header>

    <nav>
        <!-- Navigation injected by layout.js -->
    </nav>

    <main class="quiz-container">
        <div id="score-panel">
            <div id="score-display">Score: 0 / 0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div id="quiz"></div>
    </main>

    <script>
        const questions = [
            // --- Architecture & Core (20) ---
            { q: "Which global object is used for all database interactions in Moodle?", options: ["$DATABASE", "$DB", "$SQL", "$MOODLE_DB"], answer: 1 },
            { q: "What is the correct file to define a plugin's version and dependencies?", options: ["config.php", "version.php", "plugin.php", "manifest.xml"], answer: 1 },
            { q: "Which constant prevents direct access to library files?", options: ["MOODLE_INTERNAL", "MOODLE_ACCESS", "DirectAccess", "MOODLE_LIB"], answer: 0 },
            { q: "What is MUC?", options: ["Moodle User Control", "Moodle Universal Cache", "Moodle Unified Core", "Moodle Update Center"], answer: 1 },
            { q: "What is the purpose of the 'upgrade.php' file in the 'db' folder?", options: ["To upgrade Moodle core", "To handle database schema changes for the plugin", "To update the plugin version number", "To install the plugin"], answer: 1 },
            { q: "Which file is used to define database tables in XML format?", options: ["schema.xml", "database.xml", "install.xml", "tables.xml"], answer: 2 },
            { q: "What is the purpose of `lib.php` in a plugin?", options: ["It is the main entry point for external functions", "It contains the class definitions", "It contains general purpose functions and callbacks for the plugin", "It stores the language strings"], answer: 2 },
            { q: "Which global variable holds the current course, user, and page context?", options: ["$GLOBAL", "$CONTEXT", "$PAGE", "$MOODLE"], answer: 2 },
            { q: "What does `$CFG` stand for?", options: ["Configuration", "Core File Generator", "Central Function Group", "Common File Gateway"], answer: 0 },
            { q: "Which directory contains the core Moodle libraries?", options: ["/core", "/lib", "/includes", "/src"], answer: 1 },
            { q: "What is the 'frankenstyle' naming convention?", options: ["A way to name variables", "A component naming scheme (e.g., mod_forum, block_html)", "A coding style guide", "A theme design pattern"], answer: 1 },
            { q: "Which API is used to manage files in Moodle?", options: ["File API", "Storage API", "Document API", "Upload API"], answer: 0 },
            { q: "What is the purpose of `access.php` in the `db` folder?", options: ["To define database access credentials", "To define capabilities and permissions", "To list allowed IP addresses", "To configure login settings"], answer: 1 },
            { q: "Which function is used to get the current user's ID?", options: ["$USER->id", "get_current_user_id()", "$PAGE->user->id", "current_user()"], answer: 0 },
            { q: "What is the purpose of the `events.php` file?", options: ["To log system errors", "To define event observers/handlers", "To schedule cron tasks", "To manage calendar events"], answer: 1 },
            { q: "Which class is the base class for all Moodle forms?", options: ["moodleform", "form_base", "html_form", "MoodleForm"], answer: 0 },
            { q: "What is the purpose of `tasks.php` in the `db` folder?", options: ["To define scheduled tasks", "To list to-do items", "To manage user assignments", "To configure cron frequency"], answer: 0 },
            { q: "Which global object is used for outputting HTML?", options: ["$HTML", "$OUTPUT", "$PAGE", "$RENDERER"], answer: 1 },
            { q: "What is the standard location for language strings in a plugin?", options: ["/lang/en/", "/languages/", "/strings/", "/locales/"], answer: 0 },
            { q: "Which function is used to print a debugging message?", options: ["debug()", "print_debug()", "debugging()", "log_message()"], answer: 2 },

            // --- PHP & Development (20) ---
            { q: "What is the recommended way to include JavaScript in a Moodle page?", options: ["<script> tags", "AMD Modules (RequireJS)", "jQuery directly", "Inline JS"], answer: 1 },
            { q: "What is the purpose of `sesskey()` in Moodle forms?", options: ["To encrypt the form data", "To prevent Cross-Site Request Forgery (CSRF)", "To authenticate the user", "To track the session ID"], answer: 1 },
            { q: "Which function cleans a parameter to ensure it is safe to use?", options: ["clean_param()", "sanitize_input()", "safe_string()", "filter_var()"], answer: 0 },
            { q: "What is the difference between the 'Request' cache and 'Session' cache?", options: ["Request cache persists across pages, Session cache does not", "Request cache lives only for the current page load, Session cache lives for the user login duration", "They are the same", "Session cache is shared by all users"], answer: 1 },
            { q: "When should you use `$DB->get_record_sql()` instead of `$DB->get_record()`?", options: ["Always", "When you need to join tables or use complex conditions", "When fetching a single field", "When updating a record"], answer: 1 },
            { q: "Which method is used to render a Mustache template in PHP?", options: ["$OUTPUT->render()", "$OUTPUT->render_from_template()", "$PAGE->render()", "Mustache::render()"], answer: 1 },
            { q: "How do you trigger an event in Moodle?", options: ["Event::trigger()", "\\core\\event\\base::create()->trigger()", "trigger_event()", "$EVENT->fire()"], answer: 1 },
            { q: "What is the purpose of `db/services.php`?", options: ["To register external web services functions", "To list database services", "To configure server", "To manage users"], answer: 0 },
            { q: "What is a Renderer in Moodle?", options: ["A class responsible for generating HTML output", "A painter", "A database tool", "A file manager"], answer: 0 },
            { q: "How do you override a renderer?", options: ["By creating a custom theme and defining the renderer in `renderers.php`", "You can't", "Editing core files", "Using a plugin"], answer: 0 },
            { q: "What is the `OUTPUT` global?", options: ["Instance of core_renderer", "Output buffer", "HTML string", "File handle"], answer: 0 },
            { q: "What is the `PAGE` global?", options: ["Instance of moodle_page, manages page setup", "Page content", "HTML", "URL"], answer: 0 },
            { q: "What is the `DB` global?", options: ["Instance of moodle_database", "Database name", "SQL query", "Table"], answer: 0 },
            { q: "What is the `USER` global?", options: ["Object containing current user data", "User ID", "Username", "User list"], answer: 0 },
            { q: "What is the `COURSE` global?", options: ["Object containing current course data", "Course ID", "Course name", "Course list"], answer: 0 },
            { q: "What is `require_login()`?", options: ["Ensures user is logged in and sets up course context", "Logs user in", "Checks password", "Redirects to home"], answer: 0 },
            { q: "What is `require_capability()`?", options: ["Checks if user has a specific permission, throws error if not", "Checks login", "Checks role", "Checks admin"], answer: 0 },
            { q: "What is `has_capability()`?", options: ["Returns true/false if user has permission", "Throws error", "Checks login", "Checks role"], answer: 0 },
            { q: "What is the purpose of `version.php`?", options: ["Defines plugin version and dependencies", "Defines PHP version", "Defines Moodle version", "Defines DB version"], answer: 0 },

            // --- Plugins & Themes (20) ---
            { q: "What is a Block plugin?", options: ["Small items that appear in the side regions of pages", "A brick", "A ban", "A large plugin"], answer: 0 },
            { q: "What is an Activity Module?", options: ["Interactive learning content (Quiz, Forum, Assignment)", "A static page", "A setting", "A user"], answer: 0 },
            { q: "What is a Filter plugin?", options: ["Modifies content before it is displayed (e.g., auto-linking)", "A search filter", "A database filter", "A user filter"], answer: 0 },
            { q: "What is an Authentication plugin?", options: ["Handles user login (LDAP, OAuth, Manual)", "A security check", "A password", "A user"], answer: 0 },
            { q: "What is an Enrolment plugin?", options: ["Handles how users get into courses (Manual, PayPal, Cohort)", "A list", "A form", "A user"], answer: 0 },
            { q: "What is a Repository plugin?", options: ["Allows users to bring content into Moodle (Google Drive, Dropbox)", "A storage", "A database", "A folder"], answer: 0 },
            { q: "What is a Portfolio plugin?", options: ["Allows users to export content out of Moodle", "A folder", "A resume", "A file"], answer: 0 },
            { q: "What is a Theme plugin?", options: ["Controls the look and feel of the site", "A song", "A topic", "A plugin"], answer: 0 },
            { q: "What is a Local plugin?", options: ["General purpose customizations that don't fit other types", "A translation", "A map", "A user"], answer: 0 },
            { q: "What is an Admin Tool plugin?", options: ["Functionality for administrators", "A hammer", "A setting", "A user"], answer: 0 },
            { q: "What is the `mod_form.php` file?", options: ["Defines the settings form for an activity module", "A database form", "A user form", "A login form"], answer: 0 },
            { q: "What is `view.php` typically used for?", options: ["The main page for an activity module instance", "Viewing a user", "Viewing logs", "Viewing files"], answer: 0 },
            { q: "What is `index.php` typically used for in a module?", options: ["Listing all instances of the module in a course", "Home page", "Login page", "Error page"], answer: 0 },
            { q: "What is the `lang` folder?", options: ["Contains language strings", "Contains code", "Contains images", "Contains styles"], answer: 0 },
            { q: "What is `get_string()`?", options: ["Retrieves a localized string", "Gets a variable", "Gets a file", "Gets a user"], answer: 0 },
            { q: "What is the `pix` folder?", options: ["Contains icons and images", "Contains pixels", "Contains code", "Contains styles"], answer: 0 },
            { q: "What is `amd` folder?", options: ["Asynchronous Module Definition (JavaScript)", "AMD processor", "A folder", "A file"], answer: 0 },
            { q: "What is Grunt used for in Moodle?", options: ["Building JS (AMD) and CSS (LESS/SCSS)", "A sound", "A database", "A server"], answer: 0 },
            { q: "What is Behat?", options: ["Behavior Driven Development (BDD) testing framework", "A hat", "A bee", "A tool"], answer: 0 },
            { q: "What is PHPUnit?", options: ["Unit testing framework for PHP", "A unit", "A test", "A tool"], answer: 0 },

            // --- Administration & Security (20) ---
            { q: "What is Cron in Moodle?", options: ["Background script that runs scheduled tasks", "A time", "A user", "A plugin"], answer: 0 },
            { q: "How often should Cron run?", options: ["Every minute", "Every hour", "Every day", "Every week"], answer: 0 },
            { q: "What is Maintenance Mode?", options: ["Prevents users from logging in during updates", "Fixing bugs", "Cleaning", "Sleeping"], answer: 0 },
            { q: "What is Purge Caches?", options: ["Clears all Moodle caches (Theme, JS, Language, DB)", "Deleting files", "Deleting users", "Deleting courses"], answer: 0 },
            { q: "What is the `config.php` file?", options: ["Main configuration file (DB details, wwwroot, dataroot)", "A plugin", "A theme", "A user"], answer: 0 },
            { q: "What is `dataroot`?", options: ["Directory where Moodle stores user files (must be outside web root)", "Database root", "Web root", "Code root"], answer: 0 },
            { q: "Why must `dataroot` be outside web root?", options: ["Security (prevents direct access to files)", "Space", "Speed", "Organization"], answer: 0 },
            { q: "What is `wwwroot`?", options: ["The URL of the Moodle site", "Web root folder", "World Wide Web", "Root user"], answer: 0 },
            { q: "What is Debugging mode?", options: ["Shows error messages to help developers", "Fixing bugs", "Hiding errors", "Speeding up"], answer: 0 },
            { q: "What is the Security Overview report?", options: ["Checks for common security issues", "A police report", "A user list", "A log"], answer: 0 },
            { q: "What is IP Blocker?", options: ["Blocks access from specific IP addresses", "A firewall", "A plugin", "A user"], answer: 0 },
            { q: "What is Password Policy?", options: ["Rules for password complexity", "A law", "A setting", "A user"], answer: 0 },
            { q: "What is Notification?", options: ["Messages sent to users (Email, Web, Mobile)", "A bell", "A sound", "A popup"], answer: 0 },
            { q: "What is a Cohort?", options: ["A site-wide group of users", "A course group", "A class", "A team"], answer: 0 },
            { q: "What is a Role?", options: ["A collection of permissions (Student, Teacher, Admin)", "A character", "A job", "A user"], answer: 0 },
            { q: "What is Context?", options: ["The scope where a role is assigned (System, Category, Course, Module)", "A text", "A situation", "A place"], answer: 0 },
            { q: "What is Backup & Restore?", options: ["Saving and loading courses", "Saving files", "Saving users", "Saving database"], answer: 0 },
            { q: "What is LTI?", options: ["Learning Tools Interoperability (connecting external tools)", "A sandwich", "A protocol", "A tool"], answer: 0 },
            { q: "What is SCORM?", options: ["Standard for e-learning content", "A storm", "A score", "A form"], answer: 0 },
            { q: "What is H5P?", options: ["Interactive HTML5 content", "A code", "A file", "A tool"], answer: 0 }
        ];

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            const quizContainer = document.getElementById('quiz');
            const scoreDisplay = document.getElementById('score-display');
            const progressBar = document.getElementById('progress');
            let score = 0;
            let answeredCount = 0;

            // Shuffle questions
            shuffleArray(questions);

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question';
                
                const title = document.createElement('h3');
                title.textContent = `${index + 1}. ${q.q}`;
                qEl.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                let optionsWithIndices = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                shuffleArray(optionsWithIndices);

                optionsWithIndices.forEach(optObj => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.textContent = optObj.text;
                    
                    btn.onclick = () => {
                        if (optionsDiv.classList.contains('answered')) return;
                        
                        optionsDiv.classList.add('answered');
                        answeredCount++;
                        
                        const progressPercent = (answeredCount / questions.length) * 100;
                        progressBar.style.width = `${progressPercent}%`;

                        if (optObj.originalIndex === q.answer) {
                            score++;
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('incorrect');
                        }

                        Array.from(optionsDiv.children).forEach(child => {
                            if (child.textContent === q.options[q.answer]) {
                                child.classList.add('correct');
                            } else if (child !== btn) {
                                child.classList.add('dimmed');
                            }
                        });

                        scoreDisplay.textContent = `Score: ${score} / ${questions.length}`;
                    };
                    
                    optionsDiv.appendChild(btn);
                });

                qEl.appendChild(optionsDiv);
                quizContainer.appendChild(qEl);
            });
            
            scoreDisplay.textContent = `Score: 0 / ${questions.length}`;
        }

        if (typeof initLayout === 'function') {
            initLayout();
        }
        initQuiz();
    </script>
</body>
</html>
